<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c5a2c">
<title>Animal Conservation</title>
<style>
  :root {
    --pt: max(8px, env(safe-area-inset-top, 0px));
    --pr: max(8px, env(safe-area-inset-right, 0px));
    --pb: max(8px, env(safe-area-inset-bottom, 0px));
    --pl: max(8px, env(safe-area-inset-left, 0px));
    --paper: #f6ecd0;
    --ink: #3b2a14;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; position: fixed; inset: 0; overflow: hidden;
    background: #2c5a2c; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #game { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }

  /* ---------- Buttons ---------- */
  .btn {
    min-width: 48px; min-height: 48px; padding: 0 14px; margin: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 12px; border: 2px solid rgba(0,0,0,.4);
    background: var(--paper); color: var(--ink);
    font-family: inherit; font-weight: 700; font-size: 15px; line-height: 1; white-space: nowrap;
    box-shadow: 0 3px 0 rgba(0,0,0,.35); touch-action: none; cursor: pointer;
  }
  .btn.primary { background: #5fb53c; color: #fff; }
  .btn.active { background: #ffd34d; border-color: #a86b00; }
  .btn.disabled, .btn:disabled { opacity: .45; }

  /* ---------- Menu screens ---------- */
  .screen {
    position: absolute; inset: 0; padding: var(--pt) var(--pr) var(--pb) var(--pl);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(#4a9a3f, #2a622a);
  }
  .screen h1 { margin: 0 0 6px; font-size: 30px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .screen h2 { margin: 0; font-size: 22px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .screen .back { position: absolute; left: var(--pl); top: var(--pt); }
  #menuButtons { display: flex; gap: 14px; }
  #menuButtons .btn { min-width: 130px; min-height: 60px; font-size: 18px; }
  #levelLine { display: flex; align-items: center; }
  .node {
    width: 64px; height: 64px; border-radius: 50%; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); font-weight: 800; font-size: 24px;
    border: 3px solid rgba(0,0,0,.45); box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer;
  }
  .node.done { background: #5fb53c; color: #fff; }
  .node.locked { background: #5a6a5a; color: #cfd8cf; box-shadow: none; }
  .node .check {
    position: absolute; right: -6px; top: -6px; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; color: #2e7d32; font-size: 17px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #2e7d32;
  }
  .link { width: 5vw; max-width: 44px; height: 6px; background: rgba(255,255,255,.4); }
  #beastGrid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 92vw; }
  .beast {
    width: 86px; height: 92px; border-radius: 14px; background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 2px solid rgba(0,0,0,.4); box-shadow: 0 3px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .beast .em { font-size: 44px; line-height: 1.1; }
  .beast.locked { background: #66705f; color: #dfe6da; box-shadow: none; }
  .beast.locked .em { filter: brightness(0); opacity: .75; }

  /* ---------- In-level HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud > * , #leftCol > *, #animalsGroup > * { pointer-events: auto; }
  #leftCol {
    position: absolute; left: var(--pl); top: var(--pt); bottom: var(--pb);
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
    pointer-events: none !important;
  }
  #animalsGroup { display: flex; flex-direction: column; align-items: flex-start; flex: 0 1 auto; min-height: 0; pointer-events: none !important; }
  #leftCol .btn { flex: 0 0 auto; margin-top: 6px; }
  #animalsGroup .btn { margin-top: 0; }
  #panel {
    flex: 0 1 auto; min-height: 0; max-height: 0; overflow-x: hidden; overflow-y: auto;
    transition: max-height .25s ease; scrollbar-width: none; border-radius: 0 0 12px 12px;
  }
  #panel::-webkit-scrollbar { display: none; }
  #panel.open { max-height: 100vh; }
  .row { display: flex; gap: 4px; margin-top: 6px; }
  .icon {
    position: relative; width: 56px; height: 52px; border-radius: 10px; font-size: 30px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding-bottom: 6px;
    background: var(--paper); border: 2px solid rgba(0,0,0,.4); box-shadow: 0 3px 0 rgba(0,0,0,.35);
    touch-action: none; cursor: grab;
  }
  .badge {
    position: absolute; right: 2px; bottom: 2px; padding: 1px 5px; border-radius: 8px;
    font-size: 12px; font-weight: 800; line-height: 1.2; background: #2e7d32; color: #fff;
  }
  .badge.price { background: #b07a09; }
  .plus { width: 48px; height: 52px; min-height: 52px; padding: 0; font-size: 24px; margin: 0 !important; }

  #topCenter { position: absolute; left: 50%; top: var(--pt); transform: translateX(-50%); width: min(38vw, 260px); text-align: center; pointer-events: none !important; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  #wbRow { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; }
  #wbNum { min-width: 30px; text-align: right; }
  #wbBar { flex: 1; height: 14px; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,.5); border: 2px solid rgba(0,0,0,.5); }
  #wbFill { height: 100%; width: 100%; background: #5bc236; }
  #goal { margin-top: 3px; font-size: 14px; font-weight: 700; }

  #topRight { position: absolute; right: var(--pr); top: var(--pt); display: flex; gap: 8px; align-items: center; pointer-events: none !important; }
  #money { position: relative; height: 48px; padding: 0 12px; border-radius: 12px; background: rgba(0,0,0,.5); display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; }
  #btnPause { pointer-events: auto; padding: 0; font-size: 20px; }
  .floater { position: absolute; right: 10px; top: 100%; color: #ffe36e; font-weight: 800; font-size: 16px; text-shadow: 0 1px 2px #000; animation: floatUp 1.5s ease-out forwards; pointer-events: none; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(8px); } to { opacity: 0; transform: translateY(-22px); } }

  #sell {
    position: absolute; right: var(--pr); bottom: var(--pb); width: 76px; height: 76px; border-radius: 50%;
    background: #c0392b; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; line-height: 1;
    transition: transform .1s;
  }
  #sell small { font-size: 12px; font-weight: 800; margin-top: 2px; }
  #sell.hot { transform: scale(1.18); background: #e74c3c; }
  #btnAnimals.hot { background: #9be07a; }
  #trash { position: absolute; transform: translate(-50%, -50%); padding: 0; font-size: 22px; background: #e2574c; }
  #toast {
    position: absolute; left: 50%; bottom: var(--pb); transform: translateX(-50%); max-width: 60vw;
    background: rgba(0,0,0,.78); padding: 8px 14px; border-radius: 10px; font-size: 14px; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none !important;
  }
  #toast.show { opacity: 1; }

  /* ---------- Dialogs ---------- */
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 8px; }
  #dialog {
    background: var(--paper); color: var(--ink); border-radius: 16px; padding: 14px 20px 16px;
    min-width: 270px; max-width: min(92vw, 460px); text-align: center;
    border: 3px solid rgba(0,0,0,.45); box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #dialog h2 { margin: 0 0 6px; font-size: 20px; }
  #dialog p { margin: 4px 0; font-size: 15px; }
  #dialog .big { font-size: 46px; line-height: 1.1; }
  .dlgBtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .dlgBtns .btn { min-width: 120px; }
  .sliderRow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .sliderRow .btn { padding: 0; font-size: 22px; }
  input[type=range] { flex: 1; width: 100%; height: 48px; margin: 0; accent-color: #5fb53c; }
  .optRow { display: flex; align-items: center; gap: 10px; margin-top: 6px; text-align: left; }
  .optRow label { width: 90px; font-weight: 700; }
  select { flex: 1; min-height: 48px; font: inherit; font-size: 16px; border-radius: 10px; padding: 0 8px; }

  #rotate {
    position: absolute; inset: 0; z-index: 100; background: #1d3b1d;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-size: 20px; font-weight: 700; text-align: center; padding: 20px;
  }
  #rotate .big { font-size: 64px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- In-level HUD (floats over the canvas) -->
<div id="hud" class="hidden">
  <div id="leftCol">
    <div id="animalsGroup">
      <button id="btnAnimals" class="btn"><span>🐾</span><span data-i18n="btn_animals"></span></button>
      <div id="panel"></div>
    </div>
    <button id="btnEdit" class="btn"><span>✏️</span><span data-i18n="btn_edit"></span></button>
    <button id="btnPen" class="btn"><span>🔨</span><span data-i18n="btn_new_pen"></span></button>
  </div>
  <div id="topCenter">
    <div id="wbRow"><span>❤️</span><span id="wbNum">100</span><div id="wbBar"><div id="wbFill"></div></div></div>
    <div id="goal"></div>
  </div>
  <div id="topRight">
    <div id="money"><span>💰</span><span id="moneyVal">0</span></div>
    <button id="btnPause" class="btn">⏸</button>
  </div>
  <div id="sell" class="hidden"><span>💰</span><small data-i18n="sell"></small></div>
  <button id="trash" class="btn hidden">🗑️</button>
  <div id="toast"></div>
</div>

<!-- Menu screens -->
<div id="menu" class="screen">
  <h1 data-i18n="title"></h1>
  <div style="font-size:40px">🐔 🐰 🦌 🐺 🐯 🐘</div>
  <div id="menuButtons">
    <button id="btnLevels" class="btn primary" data-i18n="menu_levels"></button>
    <button id="btnOptions" class="btn" data-i18n="menu_options"></button>
    <button id="btnBestiary" class="btn" data-i18n="menu_bestiary"></button>
  </div>
</div>
<div id="levels" class="screen hidden">
  <button class="btn back" data-back="1">◀ <span data-i18n="back"></span></button>
  <h2 data-i18n="menu_levels"></h2>
  <div id="levelLine"></div>
</div>
<div id="bestiary" class="screen hidden">
  <button class="btn back" data-back="1">◀ <span data-i18n="back"></span></button>
  <h2 data-i18n="menu_bestiary"></h2>
  <div id="beastGrid"></div>
</div>

<!-- Dialog layer (one dialog at a time) -->
<div id="overlay" class="hidden"><div id="dialog"></div></div>

<!-- Portrait blocker -->
<div id="rotate" class="hidden"><div class="big">📱↻</div><div data-i18n="rotate"></div></div>

<script>
'use strict';

/* =====================================================================
   1. CONFIG — every tunable number lives here
   ===================================================================== */
const CONFIG = {
  saveKey: 'animalConservation.save.v1',

  // Simulation
  simStep: 1 / 30,            // fixed time step (seconds)
  maxFrameTime: 0.25,         // clamp for long frames (tab switch etc.)

  // Economy
  donationInterval: 5,        // seconds between donation ticks
  penCostPerCell: 5,
  sellFactorAdult: 0.6,
  sellFactorBaby: 0.3,
  babyIncomeFactor: 0.5,
  varietyBonus: 0.15,         // per extra species in pens
  moodBase: 0.5,              // mood = moodBase + moodRange * wellBeing/100
  moodRange: 0.5,

  // Well-being
  wellBeingStart: 100,
  wellBeingMax: 100,
  wellBeingFall: 0.2,         // per second with one unhappy pen
  wellBeingFallExtra: 0.5,    // extra factor per additional unhappy pen
  wellBeingRise: 0.1,         // per second when nobody is unhappy
  wbYellowBelow: 60,
  wbRedBelow: 30,

  // Breeding and growth
  breedMin: 40,
  breedMax: 90,
  courtshipTime: 4,
  growTime: 60,
  babyCrowdWeight: 0.5,
  babyScale: 0.5,

  // Animal movement (in cells)
  wanderSpeed: 0.45,
  wanderPauseMin: 0.6,
  wanderPauseMax: 3.5,
  penMargin: 0.3,             // animals keep this far from the fence

  // Feedback icons
  sadIconInterval: 1.3,
  sadIconLife: 1.6,
  sadIconSpeed: 0.55,         // cells per second upward

  // Input (CSS pixels)
  dragLift: 44,               // dragged item is drawn this far above a finger
  pickRadius: 26,             // how close a press must be to grab an animal
  handleRadius: 26,           // how close a press must be to grab a pen corner
  tapSlop: 10,                // movement below this still counts as a tap

  defaultVolume: 0.6,

  // Animals: price / income per donation tick / species they fear
  animalOrder: ['chicken', 'rabbit', 'deer', 'wolf', 'tiger', 'elephant'],
  animals: {
    chicken:  { emoji: '🐔', price: 20,  rate: 1,   fears: ['wolf', 'tiger'] },
    rabbit:   { emoji: '🐰', price: 30,  rate: 1.5, fears: ['wolf', 'tiger'] },
    deer:     { emoji: '🦌', price: 60,  rate: 3,   fears: ['wolf', 'tiger'] },
    wolf:     { emoji: '🐺', price: 100, rate: 5,   fears: ['tiger'] },
    tiger:    { emoji: '🐯', price: 200, rate: 10,  fears: [] },
    elephant: { emoji: '🐘', price: 300, rate: 15,  fears: [] }
  },

  // Levels. goal.type is 'money' (reach amount) or 'animals' (adults of a species in pens)
  levels: [
    { cols: 8,  rows: 6,  money: 100, stock: { chicken: 2 },  species: ['chicken', 'rabbit'],
      goal: { type: 'money', amount: 300 } },
    { cols: 10, rows: 7,  money: 150, stock: { rabbit: 2 },   species: ['chicken', 'rabbit', 'deer'],
      goal: { type: 'animals', species: 'rabbit', amount: 6 } },
    { cols: 12, rows: 8,  money: 250, stock: { deer: 2 },     species: ['chicken', 'rabbit', 'deer', 'wolf'],
      goal: { type: 'money', amount: 800 } },
    { cols: 14, rows: 9,  money: 400, stock: { wolf: 2 },     species: ['chicken', 'rabbit', 'deer', 'wolf', 'tiger'],
      goal: { type: 'animals', species: 'tiger', amount: 3 } },
    { cols: 16, rows: 10, money: 600, stock: { elephant: 2 }, species: ['chicken', 'rabbit', 'deer', 'wolf', 'tiger', 'elephant'],
      goal: { type: 'money', amount: 3000 } }
  ]
};

/* =====================================================================
   2. STRINGS — every visible text, keyed by id, one object per language
   ===================================================================== */
const STRINGS = {
  en: {
    lang_name: 'English',
    title: 'Animal Conservation',
    rotate: 'Please rotate your device',
    menu_levels: 'Levels', menu_options: 'Options', menu_bestiary: 'Bestiary',
    back: 'Back', menu: 'Menu',

    btn_animals: 'Animals', btn_edit: 'Edit', btn_new_pen: 'New pen', sell: 'Sell',

    level_n: 'Level {n}', start: 'Start',
    goal_money: 'Money {cur} / {goal}',
    goal_animals: 'Adult {animals} {cur} / {goal}',
    goal_money_desc: 'Goal: reach {goal} money.',
    goal_animals_desc: 'Goal: have {goal} adult {animals} in pens.',
    intro_hint: 'Keep well-being above 0.',

    pen_title: 'Build this pen?',
    pen_text: '{w} × {h} cells for {cost} money.',
    confirm: 'Confirm', cancel: 'Cancel',
    cost_label: '💰 {n}',

    buy_title: 'Buy {animal}',
    buy_each: '{price} money each',
    buy_total: '{n} × {animal} — total {total}',
    buy_none: "You can't afford any right now.",
    accept: 'Accept',

    sell_confirm: 'Sell this {animal} for {price}?',
    baby_of: 'baby {animal}',
    yes: 'Yes', no: 'No',

    win_title: 'Level complete!', win_text: 'You reached the goal.',
    win_all: 'You finished every level. Thank you for playing!',
    next_level: 'Next level',
    lose_title: 'Level lost', lose_text: 'Well-being dropped to 0.',
    restart: 'Restart',

    pause_title: 'Paused', resume: 'Resume', restart_level: 'Restart level',
    options: 'Options', quit: 'Quit to level select',
    opt_volume: 'Volume', opt_language: 'Language',

    locked: '???',
    best_fears: 'Fears: {list}', best_nothing: 'nothing',
    best_price: 'Price: {n}', best_income: 'Income: {n} per {s} s',

    toast_need_pen: 'Build a pen first.',
    toast_pen_mode: 'Drag on the field to draw a pen.',
    toast_edit_mode: 'Drag a corner to resize. Tap an empty pen to delete it.',
    toast_pen_not_empty: 'Move the animals out before deleting this pen.',

    name_chicken: 'Chicken',   names_chicken: 'Chickens',
    name_rabbit: 'Rabbit',     names_rabbit: 'Rabbits',
    name_deer: 'Deer',         names_deer: 'Deer',
    name_wolf: 'Wolf',         names_wolf: 'Wolves',
    name_tiger: 'Tiger',       names_tiger: 'Tigers',
    name_elephant: 'Elephant', names_elephant: 'Elephants',
    desc_chicken: 'A cheerful bird that is easy to keep and quick to win over visitors.',
    desc_rabbit: 'A gentle hopper that loves company and soft grass.',
    desc_deer: 'A graceful forest dweller that startles easily around predators.',
    desc_wolf: 'A clever pack hunter that makes smaller animals nervous.',
    desc_tiger: 'A powerful striped cat that fears nothing and frightens almost everyone.',
    desc_elephant: 'A calm giant with a long memory that draws the biggest crowds.'
  }
};

/** Look up a string by id in the current language and fill {placeholders}. */
function t(id, vars) {
  const dict = STRINGS[Save.data.lang] || STRINGS.en;
  let s = dict[id];
  if (s === undefined) s = STRINGS.en[id];
  if (s === undefined) s = id;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
  return s;
}

/* =====================================================================
   3. SAVE DATA — localStorage with in-memory fallback
   ===================================================================== */
const Save = {
  data: { unlocked: [0], completed: [], bestiary: [], volume: CONFIG.defaultVolume, lang: 'en' },

  load() {
    try {
      const raw = window.localStorage.getItem(CONFIG.saveKey);
      if (!raw) return;
      const d = JSON.parse(raw);
      const n = CONFIG.levels.length;
      const validLevel = i => Number.isInteger(i) && i >= 0 && i < n;
      if (Array.isArray(d.unlocked)) this.data.unlocked = d.unlocked.filter(validLevel);
      if (Array.isArray(d.completed)) this.data.completed = d.completed.filter(validLevel);
      if (Array.isArray(d.bestiary)) this.data.bestiary = d.bestiary.filter(s => CONFIG.animals[s]);
      if (typeof d.volume === 'number') this.data.volume = Math.min(1, Math.max(0, d.volume));
      if (typeof d.lang === 'string' && STRINGS[d.lang]) this.data.lang = d.lang;
      if (!this.data.unlocked.includes(0)) this.data.unlocked.push(0);
    } catch (e) { /* storage unavailable or corrupt: keep in-memory defaults */ }
  },

  store() {
    try { window.localStorage.setItem(CONFIG.saveKey, JSON.stringify(this.data)); }
    catch (e) { /* storage unavailable: progress lives in memory only */ }
  }
};

/* =====================================================================
   4. STATE
   ===================================================================== */
/** G is the level in progress (pure game data, no DOM). null outside a level. */
let G = null;

/** UI state: which screen, which mode, what the finger is doing. */
const UI = {
  screen: 'menu',     // 'menu' | 'levels' | 'bestiary' | 'game'
  mode: null,         // null | 'pen' | 'edit' | 'animals'
  dialog: null,       // the open dialog spec, or null
  rotate: false,      // portrait blocker visible
  drag: null,         // current drag gesture (see section 6)
  selectedPen: null,  // pen tapped in edit mode
  pendingPen: null    // rectangle waiting in the pen confirm dialog
};

/* =====================================================================
   5. GAME LOGIC — no DOM or canvas access in this section
   ===================================================================== */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function newLevelState(idx) {
  const L = CONFIG.levels[idx];
  const stock = {};
  for (const sp of L.species) stock[sp] = { adults: L.stock[sp] || 0, babies: [] };
  return {
    levelIdx: idx, level: L, cols: L.cols, rows: L.rows,
    money: L.money, wellBeing: CONFIG.wellBeingStart,
    pens: [], stock, particles: [], events: [],
    donationT: 0, time: 0, nextId: 1,
    over: null                 // null | 'win' | 'lose'
  };
}

/* ----- rectangles (all in whole cells: x, y, w, h) ----- */
function rectFromCells(ax, ay, bx, by) {
  return { x: Math.min(ax, bx), y: Math.min(ay, by), w: Math.abs(ax - bx) + 1, h: Math.abs(ay - by) + 1 };
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
/** True when two non-overlapping rectangles touch along an edge or at a corner. */
function rectsTouch(a, b) {
  return a.x <= b.x + b.w && b.x <= a.x + a.w && a.y <= b.y + b.h && b.y <= a.y + a.h;
}
function rectInField(r) {
  return r.x >= 0 && r.y >= 0 && r.x + r.w <= G.cols && r.y + r.h <= G.rows;
}
function overlapsAnyPen(r, except) {
  for (const p of G.pens) if (p !== except && rectsOverlap(r, p)) return true;
  return false;
}
function penAtCell(cx, cy) {
  for (const p of G.pens) if (cx >= p.x && cx < p.x + p.w && cy >= p.y && cy < p.y + p.h) return p;
  return null;
}

/* ----- pens ----- */
const penCost = cells => cells * CONFIG.penCostPerCell;
function penSpecies(p) { return p.animals.length ? p.animals[0].species : null; }
/** Animal count for crowding: adults count 1, babies 0.5. */
function penLoad(p) {
  let n = 0;
  for (const a of p.animals) n += a.adult ? 1 : CONFIG.babyCrowdWeight;
  return n;
}
function penAccepts(p, species) { const s = penSpecies(p); return s === null || s === species; }

/** A new pen is valid when it is inside the field, overlaps nothing and is affordable. */
function checkNewPen(r) {
  const cost = penCost(r.w * r.h);
  return { cost, valid: rectInField(r) && !overlapsAnyPen(r, null) && cost <= G.money };
}
function createPen(r) {
  const info = checkNewPen(r);
  if (!info.valid) return null;
  G.money -= info.cost;
  const pen = { id: G.nextId++, x: r.x, y: r.y, w: r.w, h: r.h, animals: [],
                crowded: false, scared: false, breedT: null, court: null, sadT: 0 };
  G.pens.push(pen);
  return pen;
}
/** Resizing: growing charges for the added cells, shrinking refunds nothing. */
function checkResize(pen, orig, r) {
  const cost = penCost(Math.max(0, r.w * r.h - orig.w * orig.h));
  return { cost, valid: rectInField(r) && !overlapsAnyPen(r, pen) && cost <= G.money };
}
function deletePen(pen) {
  if (pen.animals.length) return false;
  G.pens.splice(G.pens.indexOf(pen), 1);
  return true;
}

/* ----- animals and stock ----- */
function makeAnimal(species, adult, age, x, y) {
  return { id: G.nextId++, species, adult, age, x, y, tx: x, ty: y,
           wait: rand(0, CONFIG.wanderPauseMax), held: false };
}
function stockCount(sp) { const s = G.stock[sp]; return s ? s.adults + s.babies.length : 0; }
/** What the next animal taken from stock would be (adults first, then babies). */
function peekStock(sp) {
  const s = G.stock[sp];
  if (!s) return null;
  if (s.adults > 0) return { adult: true, age: CONFIG.growTime };
  if (s.babies.length) return { adult: false, age: s.babies[s.babies.length - 1] };
  return null;
}
function takeFromStock(sp) {
  const next = peekStock(sp);
  if (!next) return null;
  if (next.adult) G.stock[sp].adults--; else G.stock[sp].babies.pop();
  return next;
}
function clampToPen(p, a) {
  const m = CONFIG.penMargin;
  a.x = clamp(a.x, p.x + m, p.x + p.w - m);  a.y = clamp(a.y, p.y + m, p.y + p.h - m);
  a.tx = clamp(a.tx, p.x + m, p.x + p.w - m); a.ty = clamp(a.ty, p.y + m, p.y + p.h - m);
}
/** Move one animal from stock into a pen at field position (fx, fy). */
function placeFromStock(sp, pen, fx, fy) {
  if (!penAccepts(pen, sp)) return false;
  const next = takeFromStock(sp);
  if (!next) return false;
  const a = makeAnimal(sp, next.adult, next.age, fx, fy);
  clampToPen(pen, a);
  pen.animals.push(a);
  return true;
}
function cancelCourtship(pen) { pen.court = null; pen.breedT = null; }
function removeFromPen(pen, a) {
  const i = pen.animals.indexOf(a);
  if (i < 0) return false;
  pen.animals.splice(i, 1);
  if (pen.court && (pen.court.a === a || pen.court.b === a)) cancelCourtship(pen);
  return true;
}
function returnToStock(pen, a) {
  if (!removeFromPen(pen, a)) return;
  if (a.adult) G.stock[a.species].adults++; else G.stock[a.species].babies.push(a.age);
}
function sellValue(species, adult) {
  return Math.round(CONFIG.animals[species].price * (adult ? CONFIG.sellFactorAdult : CONFIG.sellFactorBaby));
}
function sellFromPen(pen, a) {
  if (!removeFromPen(pen, a)) return;
  G.money += sellValue(a.species, a.adult);
}
function sellFromStock(sp) {
  const next = takeFromStock(sp);
  if (next) G.money += sellValue(sp, next.adult);
}
function maxAffordable(sp) { return Math.floor(G.money / CONFIG.animals[sp].price + 1e-9); }
function buyAnimals(sp, n) {
  const cost = n * CONFIG.animals[sp].price;
  if (n < 1 || cost > G.money + 1e-9) return false;
  G.money -= cost;
  G.stock[sp].adults += n;
  return true;
}

/* ----- economy ----- */
function computeIncome() {
  let sum = 0;
  const species = new Set();
  for (const p of G.pens) for (const a of p.animals) {
    sum += CONFIG.animals[a.species].rate * (a.adult ? 1 : CONFIG.babyIncomeFactor);
    species.add(a.species);
  }
  if (!species.size) return 0;
  const variety = 1 + CONFIG.varietyBonus * (species.size - 1);
  const mood = CONFIG.moodBase + CONFIG.moodRange * (G.wellBeing / CONFIG.wellBeingMax);
  return sum * variety * mood;
}

/* ----- goals ----- */
function goalProgress() {
  const g = G.level.goal;
  if (g.type === 'money') return { cur: G.money, target: g.amount };
  let n = 0;
  for (const p of G.pens) for (const a of p.animals) if (a.adult && a.species === g.species) n++;
  return { cur: n, target: g.amount };
}

/* ----- unhappiness ----- */
function updatePenStatus() {
  for (const p of G.pens) {
    p.crowded = penLoad(p) > p.w * p.h;
    p.scared = false;
    const sp = penSpecies(p);
    if (!sp) continue;
    const fears = CONFIG.animals[sp].fears;
    if (!fears.length) continue;
    for (const q of G.pens) {
      if (q === p) continue;
      const qs = penSpecies(q);
      if (qs && fears.includes(qs) && rectsTouch(p, q)) { p.scared = true; break; }
    }
  }
}

/* ----- per-pen simulation: growth, breeding, wandering, sad icons ----- */
function updatePen(p, dt) {
  const C = CONFIG;

  // Growth
  let adults = 0;
  for (const a of p.animals) {
    if (!a.adult) { a.age += dt; if (a.age >= C.growTime) a.adult = true; }
    if (a.adult) adults++;
  }

  // Breeding
  const eligible = adults >= 2 && !p.crowded && !p.scared;
  if (!eligible) {
    p.breedT = null; p.court = null;
  } else if (p.court) {
    p.court.t += dt;
    if (p.court.t >= C.courtshipTime) {
      const c = p.court;
      const baby = makeAnimal(c.a.species, false, 0, (c.a.x + c.b.x) / 2, (c.a.y + c.b.y) / 2 + 0.3);
      clampToPen(p, baby);
      p.animals.push(baby);
      p.court = null; p.breedT = null;
      G.events.push({ type: 'birth' });
    }
  } else {
    if (p.breedT === null) p.breedT = rand(C.breedMin, C.breedMax);
    p.breedT -= dt;
    if (p.breedT <= 0) {
      const free = p.animals.filter(a => a.adult && !a.held);
      if (free.length >= 2) {
        const i = Math.floor(Math.random() * free.length);
        let j = Math.floor(Math.random() * (free.length - 1));
        if (j >= i) j++;
        p.court = { a: free[i], b: free[j], t: 0 };
      }
    }
  }

  // Wandering (the courting pair walks toward each other instead)
  const c = p.court;
  for (const a of p.animals) {
    if (a.held) continue;
    let tx, ty, speed = C.wanderSpeed, courting = false;
    if (c && (a === c.a || a === c.b)) {
      const other = a === c.a ? c.b : c.a;
      const side = a === c.a ? -0.22 : 0.22;
      tx = (a.x + other.x) / 2 + side; ty = (a.y + other.y) / 2;
      speed *= 2; courting = true;
    } else if (a.wait > 0) {
      a.wait -= dt; tx = a.x; ty = a.y;
    } else { tx = a.tx; ty = a.ty; }
    const dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy), step = speed * dt;
    if (dist <= step) {
      a.x = tx; a.y = ty;
      if (!courting && a.wait <= 0) {
        a.wait = rand(C.wanderPauseMin, C.wanderPauseMax);
        a.tx = rand(p.x, p.x + p.w); a.ty = rand(p.y, p.y + p.h);
      }
    } else { a.x += dx / dist * step; a.y += dy / dist * step; }
    clampToPen(p, a);   // also keeps animals inside after a resize
  }

  // Sad icons
  if (p.crowded || p.scared) {
    p.sadT -= dt;
    if (p.sadT <= 0) {
      p.sadT = C.sadIconInterval;
      const kind = p.crowded && p.scared ? (Math.random() < 0.5 ? 'crowd' : 'fear') : (p.crowded ? 'crowd' : 'fear');
      G.particles.push({ kind, x: rand(p.x + 0.3, p.x + p.w - 0.3), y: rand(p.y + 0.3, p.y + p.h - 0.2), life: C.sadIconLife });
    }
  } else p.sadT = 0;
}

/** Advance the whole simulation by one fixed step. */
function update(dt) {
  if (G.over) return;
  const C = CONFIG;
  G.time += dt;

  // Well-being
  updatePenStatus();
  let unhappy = 0, animals = 0;
  for (const p of G.pens) { if (p.crowded || p.scared) unhappy++; animals += p.animals.length; }
  if (unhappy > 0) G.wellBeing -= C.wellBeingFall * (1 + C.wellBeingFallExtra * (unhappy - 1)) * dt;
  else if (animals > 0) G.wellBeing = Math.min(C.wellBeingMax, G.wellBeing + C.wellBeingRise * dt);
  if (G.wellBeing <= 0) {
    G.wellBeing = 0; G.over = 'lose'; G.events.push({ type: 'lose' });
    return;
  }

  // Donations
  G.donationT += dt;
  if (G.donationT >= C.donationInterval) {
    G.donationT -= C.donationInterval;
    const income = computeIncome();
    if (income > 0) { G.money += income; G.events.push({ type: 'donation', amount: income }); }
  }

  for (const p of G.pens) updatePen(p, dt);

  // Floating sad icons
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const s = G.particles[i];
    s.life -= dt; s.y -= C.sadIconSpeed * dt;
    if (s.life <= 0) G.particles.splice(i, 1);
  }

  checkWin();
}

/** Win triggers the moment the goal is met (also called right after player actions). */
function checkWin() {
  if (G.over) return;
  const g = goalProgress();
  if (g.cur >= g.target) { G.over = 'win'; G.events.push({ type: 'win' }); }
}

/* =====================================================================
   6. INPUT — Pointer Events, one finger only
   ===================================================================== */
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');

const Input = { pid: null, lift: 0 };
let tapCandidate = null;   // element that received the current pointerdown (see onTap)

function releasePointer() { Input.pid = null; tapCandidate = null; }

// Capture phase: accept one pointer, swallow every other one.
window.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (e.pointerType === 'mouse' && e.button !== 0) { e.stopImmediatePropagation(); return; }
  if (Input.pid !== null && e.pointerId !== Input.pid) {
    if (!e.isPrimary) { e.stopImmediatePropagation(); e.preventDefault(); return; }
    cancelDrag();          // the old pointer vanished without an "up"; start over
  }
  Input.pid = e.pointerId;
  Input.lift = e.pointerType === 'mouse' ? 0 : CONFIG.dragLift;
  tapCandidate = null;
}, true);
for (const type of ['pointermove', 'pointerup', 'pointercancel']) {
  window.addEventListener(type, e => { if (e.pointerId !== Input.pid) e.stopImmediatePropagation(); }, true);
}
// Bubble phase: drive the current drag gesture.
window.addEventListener('pointermove', e => dragMove(e.clientX, e.clientY));
window.addEventListener('pointerup', e => { dragEnd(e.clientX, e.clientY); releasePointer(); });
window.addEventListener('pointercancel', () => { cancelDrag(); releasePointer(); });
window.addEventListener('blur', () => { cancelDrag(); releasePointer(); });

// Block scrolling, zooming, selection and the context menu.
document.addEventListener('touchmove', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); }, { passive: false });
for (const type of ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart', 'dblclick', 'dragstart']) {
  document.addEventListener(type, e => e.preventDefault());
}
window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/** Tap handler built on pointer events so it obeys the one-finger rule. */
function onTap(el, fn) {
  el.addEventListener('pointerdown', () => { tapCandidate = el; });
  el.addEventListener('pointerup', e => {
    if (tapCandidate !== el) return;
    tapCandidate = null;
    if (el.disabled) return;
    const r = el.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) fn(e);
  });
  el.addEventListener('click', e => { if (e.detail === 0 && !el.disabled) fn(e); });   // keyboard activation
}

function pointIn(el, x, y) {
  const r = el.getBoundingClientRect();
  return r.width > 0 && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}
/** Screen pixels -> field coordinates (fx, fy in cells; cx, cy whole cell indices). */
function toField(px, py) {
  const F = View.field;
  const fx = (px - F.x) / F.cell, fy = (py - F.y) / F.cell;
  return { fx, fy, cx: Math.floor(fx), cy: Math.floor(fy) };
}
const cellInField = (cx, cy) => cx >= 0 && cy >= 0 && cx < G.cols && cy < G.rows;

/* ----- what is under the finger ----- */
function findAnimal(px, py) {
  const F = View.field;
  let best = null, bestD = Math.max(CONFIG.pickRadius, F.cell * 0.5);
  for (const p of G.pens) for (const a of p.animals) {
    const d = Math.hypot(F.x + a.x * F.cell - px, F.y + a.y * F.cell - py);
    if (d < bestD) { bestD = d; best = { pen: p, animal: a }; }
  }
  return best;
}
/** Pixel positions of a pen's four corner handles (drawn slightly inside the pen). */
function handlePoints(p) {
  const F = View.field, inset = Math.min(F.cell * 0.28, 12);
  const x0 = F.x + p.x * F.cell + inset, x1 = F.x + (p.x + p.w) * F.cell - inset;
  const y0 = F.y + p.y * F.cell + inset, y1 = F.y + (p.y + p.h) * F.cell - inset;
  // each handle remembers the cell of the opposite (fixed) corner
  return [
    { x: x0, y: y0, fx: p.x + p.w - 1, fy: p.y + p.h - 1 },
    { x: x1, y: y0, fx: p.x,           fy: p.y + p.h - 1 },
    { x: x0, y: y1, fx: p.x + p.w - 1, fy: p.y },
    { x: x1, y: y1, fx: p.x,           fy: p.y }
  ];
}
function findHandle(px, py) {
  let best = null, bestD = CONFIG.handleRadius;
  for (const p of G.pens) for (const h of handlePoints(p)) {
    const d = Math.hypot(h.x - px, h.y - py);
    if (d < bestD) { bestD = d; best = { pen: p, fx: h.fx, fy: h.fy }; }
  }
  return best;
}

/* ----- starting a gesture ----- */
canvas.addEventListener('pointerdown', e => {
  if (UI.screen !== 'game' || UI.dialog || UI.rotate || !G || G.over) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
  const px = e.clientX, py = e.clientY, f = toField(px, py);

  if (UI.mode === 'pen') {
    if (cellInField(f.cx, f.cy)) UI.drag = { kind: 'newpen', sx: f.cx, sy: f.cy, cx: f.cx, cy: f.cy };
    return;
  }
  if (UI.mode === 'edit') {
    const h = findHandle(px, py);
    if (h) {
      const p = h.pen;
      UI.selectedPen = null;
      UI.drag = { kind: 'corner', pen: p, fx: h.fx, fy: h.fy, orig: { x: p.x, y: p.y, w: p.w, h: p.h },
                  rect: { x: p.x, y: p.y, w: p.w, h: p.h }, valid: true, cost: 0 };
    } else {
      UI.drag = { kind: 'tap', sx: px, sy: py, pen: penAtCell(f.cx, f.cy) };
    }
    return;
  }
  // Normal play: grab an animal out of its pen.
  const hit = findAnimal(px, py);
  if (hit) {
    hit.animal.held = true;
    if (hit.pen.court && (hit.pen.court.a === hit.animal || hit.pen.court.b === hit.animal)) cancelCourtship(hit.pen);
    UI.drag = { kind: 'animal', pen: hit.pen, animal: hit.animal, species: hit.animal.species, px, py };
    Sound.play('tap');
  }
});

/** Called from the panel: press on a species icon. */
function startStockDrag(sp, e, iconEl) {
  if (UI.dialog || !G || G.over) return;
  try { iconEl.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
  const next = peekStock(sp);
  UI.drag = { kind: 'stock', species: sp, has: !!next, adult: next ? next.adult : true, age: next ? next.age : 0,
              sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, moved: false };
  if (next) Sound.play('tap');
}

/* ----- during a gesture ----- */
function dragMove(px, py) {
  const d = UI.drag;
  if (!d || !G) return;
  if (d.kind === 'newpen') {
    const f = toField(px, py); d.cx = f.cx; d.cy = f.cy;
  } else if (d.kind === 'corner') {
    const f = toField(px, py);
    d.rect = rectFromCells(d.fx, d.fy, f.cx, f.cy);
    const info = checkResize(d.pen, d.orig, d.rect);
    d.valid = info.valid; d.cost = info.cost;
    // The pen reshapes live while the shape is valid; otherwise it shows its old shape plus a red ghost.
    Object.assign(d.pen, d.valid ? d.rect : d.orig);
  } else if (d.kind === 'stock') {
    const panel = $('panel');
    if (pointIn(panel, px, py)) panel.scrollTop -= (py - d.py);   // manual scroll of the icon column
    d.px = px; d.py = py;
    if (Math.hypot(px - d.sx, py - d.sy) > CONFIG.tapSlop) d.moved = true;
  } else if (d.kind === 'animal') {
    d.px = px; d.py = py;
  }
}

/* ----- ending a gesture ----- */
function dropTarget(px, py) {
  const gy = py - Input.lift;   // the item is drawn above the finger; accept either point
  if (pointIn($('sell'), px, py) || pointIn($('sell'), px, gy)) return 'sell';
  if (pointIn($('btnAnimals'), px, py) || pointIn($('btnAnimals'), px, gy)) return 'stock';
  return null;
}

function dragEnd(px, py) {
  const d = UI.drag;
  if (!d) return;
  UI.drag = null;
  if (!G) return;

  if (d.kind === 'newpen') {
    const r = rectFromCells(d.sx, d.sy, d.cx, d.cy);
    const info = checkNewPen(r);
    if (info.valid) { UI.pendingPen = r; openPenConfirm(r, info.cost); }
    // invalid rectangle: cancelled silently, pen mode stays on
  } else if (d.kind === 'corner') {
    const changed = d.valid && (d.rect.x !== d.orig.x || d.rect.y !== d.orig.y || d.rect.w !== d.orig.w || d.rect.h !== d.orig.h);
    if (changed) {
      Object.assign(d.pen, d.rect);
      G.money -= d.cost;
      Sound.play(d.cost > 0 ? 'buy' : 'drop');
    } else {
      Object.assign(d.pen, d.orig);   // snap back
    }
  } else if (d.kind === 'tap') {
    if (Math.hypot(px - d.sx, py - d.sy) <= CONFIG.tapSlop) {
      UI.selectedPen = (d.pen && d.pen !== UI.selectedPen) ? d.pen : null;
      if (UI.selectedPen) {
        Sound.play('tap');
        if (UI.selectedPen.animals.length) showToast(t('toast_pen_not_empty'));
      }
    }
  } else if (d.kind === 'animal') {
    d.animal.held = false;
    const target = dropTarget(px, py);
    if (target === 'stock') { returnToStock(d.pen, d.animal); Sound.play('drop'); refreshPanel(); }
    else if (target === 'sell') openSellConfirm(d.species, d.animal.adult, () => sellFromPen(d.pen, d.animal));
    // anywhere else: it simply stays in its pen
  } else if (d.kind === 'stock') {
    if (!d.has) { if (!d.moved) openPurchase(d.species); return; }
    if (!d.moved) return;
    const target = dropTarget(px, py);
    if (target === 'sell') { openSellConfirm(d.species, d.adult, () => sellFromStock(d.species)); return; }
    if (target === 'stock') return;
    const f = toField(px, py - Input.lift);
    const pen = penAtCell(f.cx, f.cy);
    if (pen && placeFromStock(d.species, pen, f.fx, f.fy)) {
      Sound.play('drop'); refreshPanel(); checkWin(); handleEvents();
    }
    // grass or a pen of another species: the animal disappears, stock unchanged
  }
}

function cancelDrag() {
  const d = UI.drag;
  if (!d) return;
  UI.drag = null;
  if (d.kind === 'animal') d.animal.held = false;
  if (d.kind === 'corner') Object.assign(d.pen, d.orig);
}

/* =====================================================================
   7. RENDERING — canvas only, reads state, never changes it
   ===================================================================== */
const View = {
  w: 0, h: 0, dpr: 1,
  field: { x: 0, y: 0, cell: 32 },
  grass: null,             // pre-rendered grass tiles
  sprites: new Map()       // emoji -> pre-rendered canvas (much faster than fillText per frame)
};
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const ICON = { heart: '❤️', crowd: '😫', fear: '😱' };

function resize() {
  View.w = window.innerWidth; View.h = window.innerHeight;
  View.dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(View.w * View.dpr);
  canvas.height = Math.round(View.h * View.dpr);
  UI.rotate = View.h > View.w;
  $('rotate').classList.toggle('hidden', !UI.rotate);
  if (UI.rotate) cancelDrag();
  layoutField();
}

/** Fit the grid between the floating UI and pre-render the grass. */
function layoutField() {
  if (!G) return;
  let side = 0;
  for (const id of ['btnAnimals', 'btnEdit', 'btnPen']) side = Math.max(side, $(id).getBoundingClientRect().right);
  if (!(side > 0)) side = 110;
  side += 8;
  const tc = $('topCenter').getBoundingClientRect();
  const top = (tc.height > 0 ? tc.bottom : 52) + 6;
  const lc = $('leftCol').getBoundingClientRect();
  const bottom = lc.height > 0 ? Math.max(8, View.h - lc.bottom) : 8;
  const availW = View.w - 2 * side, availH = View.h - top - bottom;
  const cell = Math.max(10, Math.floor(Math.min(availW / G.cols, availH / G.rows)));
  View.field = {
    cell,
    x: Math.round((View.w - cell * G.cols) / 2),
    y: Math.round(top + (availH - cell * G.rows) / 2)
  };

  // Grass tiles, drawn once.
  const g = document.createElement('canvas');
  const s = cell * View.dpr;
  g.width = Math.ceil(G.cols * s); g.height = Math.ceil(G.rows * s);
  const gx = g.getContext('2d');
  for (let y = 0; y < G.rows; y++) for (let x = 0; x < G.cols; x++) {
    gx.fillStyle = (x + y) % 2 ? '#69bd49' : '#61b443';
    gx.fillRect(x * s, y * s, s + 1, s + 1);
    gx.strokeStyle = 'rgba(40,110,30,.55)'; gx.lineWidth = Math.max(1, s * 0.035);
    for (let k = 0; k < 3; k++) {        // a few grass tufts per tile
      const bx = (x + 0.15 + 0.7 * Math.random()) * s, by = (y + 0.25 + 0.6 * Math.random()) * s;
      gx.beginPath(); gx.moveTo(bx, by); gx.lineTo(bx - s * 0.04, by - s * 0.12);
      gx.moveTo(bx, by); gx.lineTo(bx + s * 0.05, by - s * 0.1); gx.stroke();
    }
  }
  View.grass = g;
  View.sprites.clear();
}

function sprite(emoji) {
  let s = View.sprites.get(emoji);
  if (!s) {
    const size = Math.ceil(Math.max(View.field.cell, 48) * View.dpr * 1.25);
    s = document.createElement('canvas'); s.width = s.height = size;
    const x = s.getContext('2d');
    x.font = Math.floor(size * 0.7) + 'px ' + EMOJI_FONT;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(emoji, size / 2, size / 2 + size * 0.05);
    View.sprites.set(emoji, s);
  }
  return s;
}
/** Draw an emoji sprite centred on (x, y) in a box of `size` CSS pixels. */
function drawEmoji(emoji, x, y, size) {
  ctx.drawImage(sprite(emoji), x - size / 2, y - size / 2, size, size);
}
function animalScale(a) {
  if (a.adult) return 1;
  return CONFIG.babyScale + (1 - CONFIG.babyScale) * clamp(a.age / CONFIG.growTime, 0, 1);
}
function label(text, x, y, color) {
  ctx.font = '800 15px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color || '#fff'; ctx.fillText(text, x, y);
}
function penPx(r) {
  const F = View.field;
  return { x: F.x + r.x * F.cell, y: F.y + r.y * F.cell, w: r.w * F.cell, h: r.h * F.cell };
}

function drawPen(p, tint) {
  const c = View.field.cell, r = penPx(p);
  ctx.fillStyle = 'rgba(226,202,138,.62)';               // trodden ground
  ctx.fillRect(r.x, r.y, r.w, r.h);
  if (p.crowded || p.scared) { ctx.fillStyle = 'rgba(220,40,30,.16)'; ctx.fillRect(r.x, r.y, r.w, r.h); }
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(r.x, r.y, r.w, r.h); }

  // Fence: rails along the border plus a post at every cell boundary.
  const inset = Math.max(2, c * 0.07), post = Math.max(4, c * 0.15);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = Math.max(2, c * 0.07);
  ctx.strokeRect(r.x + inset, r.y + inset, r.w - 2 * inset, r.h - 2 * inset);
  ctx.fillStyle = '#5c3a17';
  const iw = r.w - 2 * inset, ih = r.h - 2 * inset;
  for (let i = 0; i <= p.w; i++) {
    const x = r.x + inset + iw * i / p.w - post / 2;
    ctx.fillRect(x, r.y + inset - post / 2, post, post);
    ctx.fillRect(x, r.y + r.h - inset - post / 2, post, post);
  }
  for (let j = 1; j < p.h; j++) {
    const y = r.y + inset + ih * j / p.h - post / 2;
    ctx.fillRect(r.x + inset - post / 2, y, post, post);
    ctx.fillRect(r.x + r.w - inset - post / 2, y, post, post);
  }
}

function drawPreview(r, valid, cost) {
  const q = penPx(r);
  ctx.fillStyle = valid ? 'rgba(70,220,90,.4)' : 'rgba(235,50,40,.4)';
  ctx.fillRect(q.x, q.y, q.w, q.h);
  ctx.strokeStyle = valid ? '#2ecc40' : '#ff3b2f'; ctx.lineWidth = 3;
  ctx.strokeRect(q.x + 1.5, q.y + 1.5, q.w - 3, q.h - 3);
  if (cost !== null) {
    const ly = clamp(q.y + q.h / 2, 14, View.h - 14), lx = clamp(q.x + q.w / 2, 30, View.w - 30);
    label(t('cost_label', { n: cost }), lx, ly, valid ? '#fff' : '#ffb3ad');
  }
}

function render() {
  const F = View.field, c = F.cell, d = UI.drag;
  ctx.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
  ctx.fillStyle = '#2c5a2c';
  ctx.fillRect(0, 0, View.w, View.h);
  if (!View.grass) return;

  // Field
  ctx.fillStyle = '#1f451f';
  ctx.fillRect(F.x - 4, F.y - 4, G.cols * c + 8, G.rows * c + 8);
  ctx.drawImage(View.grass, F.x, F.y, G.cols * c, G.rows * c);

  // Pens (with green/red drop highlights while an animal from stock is dragged)
  const placing = d && d.kind === 'stock' && d.has && d.moved;
  let hover = null;
  if (placing) { const f = toField(d.px, d.py - Input.lift); hover = penAtCell(f.cx, f.cy); }
  for (const p of G.pens) {
    let tint = null;
    if (placing) {
      const ok = penAccepts(p, d.species), strong = p === hover ? '.5)' : '.25)';
      tint = (ok ? 'rgba(60,220,80,' : 'rgba(235,50,40,') + strong;
    }
    drawPen(p, tint);
  }

  // Animals
  const base = Math.max(c * 0.95, 20);
  for (const p of G.pens) for (const a of p.animals) {
    if (a.held) continue;
    const x = F.x + a.x * c, y = F.y + a.y * c, s = base * animalScale(a);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(x, y + s * 0.3, s * 0.26, s * 0.09, 0, 0, 6.2832); ctx.fill();
    drawEmoji(CONFIG.animals[a.species].emoji, x, y, s);
  }

  // Hearts over courting pairs
  for (const p of G.pens) if (p.court) {
    const x = F.x + (p.court.a.x + p.court.b.x) / 2 * c, y = F.y + (p.court.a.y + p.court.b.y) / 2 * c;
    const pulse = 1 + 0.12 * Math.sin(G.time * 7);
    drawEmoji(ICON.heart, x, y - c * 0.62, Math.max(c * 0.6, 20) * pulse);
  }

  // Floating sad icons
  for (const s of G.particles) {
    ctx.globalAlpha = clamp(s.life / 0.5, 0, 1);
    drawEmoji(ICON[s.kind], F.x + s.x * c, F.y + s.y * c, Math.max(c * 0.6, 20));
  }
  ctx.globalAlpha = 1;

  // New pen preview (while drawing, and while its confirm dialog is open)
  if (d && d.kind === 'newpen') {
    const r = rectFromCells(d.sx, d.sy, d.cx, d.cy), info = checkNewPen(r);
    drawPreview(r, info.valid, info.cost);
  } else if (UI.pendingPen) {
    drawPreview(UI.pendingPen, true, penCost(UI.pendingPen.w * UI.pendingPen.h));
  }

  // Edit mode: selection, corner handles, resize feedback
  if (UI.mode === 'edit') {
    if (UI.selectedPen) {
      const q = penPx(UI.selectedPen);
      ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 4; ctx.strokeRect(q.x + 2, q.y + 2, q.w - 4, q.h - 4);
    }
    if (d && d.kind === 'corner') {
      if (!d.valid) {
        const q = penPx(d.rect);
        ctx.save(); ctx.shadowColor = '#ff2a1a'; ctx.shadowBlur = 14;
        ctx.fillStyle = 'rgba(235,50,40,.35)'; ctx.fillRect(q.x, q.y, q.w, q.h);
        ctx.strokeStyle = '#ff3b2f'; ctx.lineWidth = 3; ctx.strokeRect(q.x + 1.5, q.y + 1.5, q.w - 3, q.h - 3);
        ctx.restore();
      }
      if (d.cost > 0) {
        const q = penPx(d.rect);
        label(t('cost_label', { n: d.cost }), clamp(q.x + q.w / 2, 30, View.w - 30), clamp(q.y + q.h / 2, 14, View.h - 14), d.valid ? '#fff' : '#ffb3ad');
      }
    }
    const hr = Math.max(7, Math.min(11, c * 0.24));
    for (const p of G.pens) for (const h of handlePoints(p)) {
      ctx.beginPath(); ctx.arc(h.x, h.y, hr, 0, 6.2832);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.strokeStyle = '#7a4a1b'; ctx.lineWidth = 3; ctx.stroke();
    }
  }

  // Dragged animal, lifted above the finger so it stays visible
  if (d && (d.kind === 'animal' || (d.kind === 'stock' && d.has))) {
    const scale = d.kind === 'animal' ? animalScale(d.animal) : (d.adult ? 1 : animalScale({ adult: false, age: d.age }));
    drawEmoji(CONFIG.animals[d.species].emoji, d.px, d.py - Input.lift, Math.max(base, 44) * 1.2 * scale);
  }
}

/* =====================================================================
   8. UI — DOM for HUD, menus and dialogs
   ===================================================================== */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const animalName = sp => t('name_' + sp);
const fmtMoney = v => String(Math.floor(v + 1e-6));

function applyStaticStrings() {
  document.documentElement.lang = Save.data.lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
}

function showScreen(name) {
  UI.screen = name;
  for (const id of ['menu', 'levels', 'bestiary']) $(id).classList.toggle('hidden', id !== name);
  $('hud').classList.toggle('hidden', name !== 'game');
  if (name === 'levels') buildLevels();
  if (name === 'bestiary') buildBestiary();
}

let toastTimer = 0;
function showToast(text) {
  const e = $('toast');
  e.textContent = text; e.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => e.classList.remove('show'), 2200);
}

/* ----- dialogs (opening any dialog pauses the simulation) ----- */
function openDialog(spec) {
  cancelDrag();
  UI.dialog = spec;
  const d = $('dialog');
  d.textContent = '';
  if (spec.big) d.appendChild(el('div', 'big', spec.big));
  if (spec.title) d.appendChild(el('h2', '', spec.title));
  for (const line of spec.lines || []) d.appendChild(el('p', '', line));
  if (spec.content) d.appendChild(spec.content);
  const row = el('div', 'dlgBtns');
  for (const b of spec.buttons) {
    if (!b) continue;
    const btn = el('button', 'btn' + (b.primary ? ' primary' : ''), b.label);
    btn.disabled = !!b.disabled;
    onTap(btn, () => {
      closeDialog();
      if (!b.silent) Sound.play('tap');
      if (b.action) b.action();
    });
    row.appendChild(btn);
  }
  d.appendChild(row);
  $('overlay').classList.remove('hidden');
}
function closeDialog() {
  UI.dialog = null;
  $('overlay').classList.add('hidden');
}

function goalDescription(L) {
  const g = L.goal;
  return g.type === 'money' ? t('goal_money_desc', { goal: g.amount })
                            : t('goal_animals_desc', { goal: g.amount, animals: t('names_' + g.species) });
}

function openPenConfirm(r, cost) {
  openDialog({
    title: t('pen_title'), lines: [t('pen_text', { w: r.w, h: r.h, cost })],
    buttons: [
      { label: t('confirm'), primary: true, silent: true, action: () => {
          UI.pendingPen = null;
          if (createPen(r)) { Sound.play('buy'); setMode(null); }
        } },
      { label: t('cancel'), action: () => { UI.pendingPen = null; } }
    ]
  });
}

function openPurchase(sp) {
  const A = CONFIG.animals[sp], max = maxAffordable(sp);
  const box = el('div');
  box.appendChild(el('p', '', t('buy_each', { price: A.price })));
  let count = 1;
  if (max < 1) {
    box.appendChild(el('p', '', t('buy_none')));
  } else {
    const row = el('div', 'sliderRow');
    const minus = el('button', 'btn', '−'), plus = el('button', 'btn', '+');
    const slider = el('input');
    slider.type = 'range'; slider.min = '1'; slider.max = String(max); slider.step = '1'; slider.value = '1';
    slider.disabled = max === 1;
    const total = el('p');
    const show = () => {
      count = clamp(parseInt(slider.value, 10) || 1, 1, max);
      total.textContent = t('buy_total', { n: count, animal: animalName(sp), total: count * A.price });
    };
    slider.addEventListener('input', show);
    onTap(minus, () => { slider.value = String(Math.max(1, count - 1)); show(); });
    onTap(plus, () => { slider.value = String(Math.min(max, count + 1)); show(); });
    row.append(minus, slider, plus);
    box.append(row, total);
    show();
  }
  openDialog({
    big: A.emoji, title: t('buy_title', { animal: animalName(sp) }), content: box,
    buttons: [
      { label: t('accept'), primary: true, disabled: max < 1, silent: true, action: () => {
          if (buyAnimals(sp, count)) { Sound.play('buy'); refreshPanel(); }
        } },
      { label: t('cancel') }
    ]
  });
}

function openSellConfirm(sp, adult, doSell) {
  const name = adult ? animalName(sp) : t('baby_of', { animal: animalName(sp) });
  openDialog({
    big: CONFIG.animals[sp].emoji,
    lines: [t('sell_confirm', { animal: name, price: sellValue(sp, adult) })],
    buttons: [
      { label: t('yes'), primary: true, silent: true, action: () => {
          doSell(); Sound.play('sell'); refreshPanel(); checkWin(); handleEvents();
        } },
      { label: t('no') }
    ]
  });
}

function openPause() {
  if (!G || G.over || UI.dialog) return;
  openDialog({
    title: t('pause_title'),
    buttons: [
      { label: t('resume'), primary: true },
      { label: t('restart_level'), action: () => startLevel(G.levelIdx) },
      { label: t('options'), action: () => openOptions(openPause) },
      { label: t('quit'), action: () => { G = null; showScreen('levels'); } }
    ]
  });
}

/** Options are a dialog so they work both from the main menu and from the pause menu. */
function openOptions(onClose) {
  const box = el('div');
  const vRow = el('div', 'optRow'), vol = el('input');
  vol.type = 'range'; vol.min = '0'; vol.max = '100'; vol.step = '1'; vol.value = String(Math.round(Save.data.volume * 100));
  vol.addEventListener('input', () => { Save.data.volume = vol.value / 100; Sound.setVolume(Save.data.volume); });
  vol.addEventListener('change', () => { Save.store(); Sound.play('tap'); });
  vRow.append(el('label', '', t('opt_volume')), vol);

  const lRow = el('div', 'optRow'), sel = el('select');
  for (const code of Object.keys(STRINGS)) {
    const o = el('option', '', STRINGS[code].lang_name || code);
    o.value = code; o.selected = code === Save.data.lang;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    Save.data.lang = sel.value; Save.store();
    applyStaticStrings();
    if (G) refreshPanel();
    showScreen(UI.screen);
    closeDialog(); openOptions(onClose);   // rebuild this dialog in the new language
  });
  lRow.append(el('label', '', t('opt_language')), sel);
  box.append(vRow, lRow);

  openDialog({ title: t('options'), content: box,
               buttons: [{ label: t('back'), primary: true, action: () => { Save.store(); if (onClose) onClose(); } }] });
}

/* ----- level select and bestiary ----- */
function buildLevels() {
  const line = $('levelLine');
  line.textContent = '';
  CONFIG.levels.forEach((L, i) => {
    if (i > 0) line.appendChild(el('div', 'link'));
    const done = Save.data.completed.includes(i), open = Save.data.unlocked.includes(i) || done;
    const node = el('div', 'node' + (done ? ' done' : '') + (open ? '' : ' locked'), open ? String(i + 1) : '🔒');
    if (done) node.appendChild(el('div', 'check', '✓'));
    if (open) onTap(node, () => { Sound.play('tap'); startLevel(i); });
    line.appendChild(node);
  });
}

function buildBestiary() {
  const grid = $('beastGrid');
  grid.textContent = '';
  for (const sp of CONFIG.animalOrder) {
    const A = CONFIG.animals[sp], known = Save.data.bestiary.includes(sp);
    const card = el('div', 'beast' + (known ? '' : ' locked'));
    card.append(el('div', 'em', A.emoji), el('div', '', known ? animalName(sp) : t('locked')));
    if (known) onTap(card, () => {
      Sound.play('tap');
      const fears = A.fears.length ? A.fears.map(animalName).join(', ') : t('best_nothing');
      openDialog({
        big: A.emoji, title: animalName(sp),
        lines: [t('desc_' + sp), t('best_fears', { list: fears }),
                t('best_price', { n: A.price }) + '  ·  ' + t('best_income', { n: A.rate, s: CONFIG.donationInterval })],
        buttons: [{ label: t('back'), primary: true }]
      });
    });
    grid.appendChild(card);
  }
}

/* ----- level flow ----- */
function startLevel(idx) {
  closeDialog();
  UI.drag = null; UI.mode = null; UI.selectedPen = null; UI.pendingPen = null;
  G = newLevelState(idx);
  for (const sp of G.level.species) if (!Save.data.bestiary.includes(sp)) Save.data.bestiary.push(sp);
  Save.store();
  showScreen('game');
  buildPanel();
  syncModeButtons();
  hud.last = {};
  updateHud();
  layoutField();
  simAccumulator = 0;
  openDialog({
    title: t('level_n', { n: idx + 1 }),
    lines: [goalDescription(G.level), t('intro_hint')],
    buttons: [{ label: t('start'), primary: true }]
  });
}

function onWin() {
  const i = G.levelIdx, hasNext = i + 1 < CONFIG.levels.length;
  if (!Save.data.completed.includes(i)) Save.data.completed.push(i);
  if (hasNext && !Save.data.unlocked.includes(i + 1)) Save.data.unlocked.push(i + 1);
  Save.store();
  Sound.play('win');
  openDialog({
    big: '🏆', title: t('win_title'), lines: [hasNext ? t('win_text') : t('win_all')],
    buttons: [
      hasNext ? { label: t('next_level'), primary: true, action: () => startLevel(i + 1) } : null,
      { label: t('menu'), action: () => { G = null; showScreen('menu'); } }
    ]
  });
}
function onLose() {
  Sound.play('lose');
  openDialog({
    big: '💔', title: t('lose_title'), lines: [t('lose_text')],
    buttons: [
      { label: t('restart'), primary: true, action: () => startLevel(G.levelIdx) },
      { label: t('menu'), action: () => { G = null; showScreen('menu'); } }
    ]
  });
}

/** React to things the simulation reported (sounds, floating numbers, end screens). */
function handleEvents() {
  if (!G) return;
  const events = G.events.splice(0);
  for (const ev of events) {
    if (ev.type === 'donation') {
      const v = ev.amount;
      const f = el('div', 'floater', '+' + (v >= 10 || Number.isInteger(v) ? Math.round(v) : v.toFixed(1)));
      $('money').appendChild(f);
      setTimeout(() => f.remove(), 1600);
    } else if (ev.type === 'birth') { Sound.play('birth'); }
    else if (ev.type === 'win') { updateHud(); onWin(); }
    else if (ev.type === 'lose') { updateHud(); onLose(); }
  }
}

/* ----- modes: pen creation, edit mode, animals panel (only one at a time) ----- */
function syncModeButtons() {
  $('btnPen').classList.toggle('active', UI.mode === 'pen');
  $('btnEdit').classList.toggle('active', UI.mode === 'edit');
  $('btnAnimals').classList.toggle('active', UI.mode === 'animals');
  $('panel').classList.toggle('open', UI.mode === 'animals');
}
function setMode(mode) {
  if (!G || G.over) return;
  cancelDrag();
  UI.mode = UI.mode === mode ? null : mode;   // tapping the active button again cancels it
  UI.selectedPen = null;
  syncModeButtons();
}
onTap($('btnPen'), () => { Sound.play('tap'); setMode('pen'); if (UI.mode === 'pen') showToast(t('toast_pen_mode')); });
onTap($('btnEdit'), () => { Sound.play('tap'); setMode('edit'); if (UI.mode === 'edit' && G.pens.length) showToast(t('toast_edit_mode')); });
onTap($('btnAnimals'), () => {
  Sound.play('tap');
  if (G && !G.pens.length && UI.mode !== 'animals') { showToast(t('toast_need_pen')); return; }
  setMode('animals');
});
onTap($('btnPause'), () => { Sound.play('tap'); openPause(); });
onTap($('trash'), () => {
  if (UI.selectedPen && deletePen(UI.selectedPen)) { Sound.play('sell'); UI.selectedPen = null; }
});
onTap($('btnLevels'), () => { Sound.play('tap'); showScreen('levels'); });
onTap($('btnBestiary'), () => { Sound.play('tap'); showScreen('bestiary'); });
onTap($('btnOptions'), () => { Sound.play('tap'); openOptions(null); });
document.querySelectorAll('[data-back]').forEach(b => onTap(b, () => { Sound.play('tap'); showScreen('menu'); }));

/* ----- animals panel ----- */
function buildPanel() {
  const panel = $('panel');
  panel.textContent = ''; panel.scrollTop = 0;
  for (const sp of G.level.species) {
    const row = el('div', 'row');
    const icon = el('div', 'icon', CONFIG.animals[sp].emoji);
    icon.appendChild(el('span', 'badge'));
    icon.dataset.species = sp;
    icon.addEventListener('pointerdown', e => startStockDrag(sp, e, icon));
    const plus = el('button', 'btn plus', '+');
    onTap(plus, () => { if (G && !G.over) { Sound.play('tap'); openPurchase(sp); } });
    row.append(icon, plus);
    panel.appendChild(row);
  }
  refreshPanel();
}
/** Update the badges in place (never rebuild the icons: one may be mid-drag). */
function refreshPanel() {
  if (!G) return;
  document.querySelectorAll('#panel .icon').forEach(icon => {
    const sp = icon.dataset.species, n = stockCount(sp), badge = icon.querySelector('.badge');
    badge.textContent = n > 0 ? String(n) : '💰' + CONFIG.animals[sp].price;
    badge.classList.toggle('price', n === 0);
  });
}

$('panel').addEventListener('wheel', e => { $('panel').scrollTop += e.deltaY; }, { passive: true });

/* ----- HUD numbers (DOM is only touched when a value changes) ----- */
const hud = { last: {} };
function setText(id, key, value) {
  if (hud.last[key] !== value) { hud.last[key] = value; $(id).textContent = value; }
}
function updateHud() {
  if (!G) return;
  const L = hud.last, d = UI.drag;
  setText('moneyVal', 'money', fmtMoney(G.money));

  const wb = Math.ceil(G.wellBeing - 1e-9);
  if (L.wb !== wb) {
    L.wb = wb;
    $('wbNum').textContent = String(wb);
    $('wbFill').style.width = (G.wellBeing / CONFIG.wellBeingMax * 100) + '%';
    $('wbFill').style.background = wb < CONFIG.wbRedBelow ? '#e2443a' : wb < CONFIG.wbYellowBelow ? '#f1c232' : '#5bc236';
  }

  const g = G.level.goal, pr = goalProgress();
  setText('goal', 'goal', g.type === 'money'
    ? t('goal_money', { cur: fmtMoney(pr.cur), goal: g.amount })
    : CONFIG.animals[g.species].emoji + ' ' + t('goal_animals', { animals: t('names_' + g.species), cur: pr.cur, goal: g.amount }));

  const noPens = G.pens.length === 0;
  if (L.noPens !== noPens) {
    L.noPens = noPens;
    $('btnAnimals').classList.toggle('disabled', noPens);
    if (noPens && UI.mode === 'animals') { UI.mode = null; syncModeButtons(); }
  }

  // Sell icon: only while an animal is being dragged
  const carrying = !!d && (d.kind === 'animal' || (d.kind === 'stock' && d.has));
  if (L.carrying !== carrying) { L.carrying = carrying; $('sell').classList.toggle('hidden', !carrying); }
  const target = carrying ? dropTarget(d.px, d.py) : null;
  if (L.target !== target) {
    L.target = target;
    $('sell').classList.toggle('hot', target === 'sell');
    $('btnAnimals').classList.toggle('hot', target === 'stock' && d.kind === 'animal');
  }

  // Trash icon: over the selected pen, only if it is empty
  const sel = UI.mode === 'edit' ? UI.selectedPen : null;
  const showTrash = !!sel && sel.animals.length === 0;
  const pos = showTrash ? penPx(sel) : null;
  const key = showTrash ? (pos.x + pos.w / 2) + ',' + (pos.y + pos.h / 2) : '';
  if (L.trash !== key) {
    L.trash = key;
    const tr = $('trash');
    tr.classList.toggle('hidden', !showTrash);
    if (showTrash) { tr.style.left = (pos.x + pos.w / 2) + 'px'; tr.style.top = (pos.y + pos.h / 2) + 'px'; }
  }
}

/* =====================================================================
   9. AUDIO — tiny synthesized sounds, started on the first tap
   ===================================================================== */
const Sound = {
  ctx: null, master: null,

  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = Save.data.volume;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  setVolume(v) { if (this.master) this.master.gain.value = v; },

  /** One enveloped oscillator note. */
  tone(freq, start, dur, type, vol, slideTo) {
    const c = this.ctx, t0 = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  },

  play(name) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    try {
      switch (name) {
        case 'tap':   this.tone(660, 0, 0.06, 'triangle', 0.18); break;
        case 'drop':  this.tone(300, 0, 0.12, 'sine', 0.3, 170); break;
        case 'buy':   this.tone(523, 0, 0.09, 'square', 0.12); this.tone(784, 0.08, 0.14, 'square', 0.12); break;
        case 'sell':  this.tone(988, 0, 0.07, 'triangle', 0.22); this.tone(1319, 0.07, 0.2, 'triangle', 0.22); break;
        case 'birth': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.09, 0.16, 'sine', 0.22)); break;
        case 'win':   [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * 0.13, i === 4 ? 0.5 : 0.18, 'triangle', 0.25)); break;
        case 'lose':  [392, 330, 262, 196].forEach((f, i) => this.tone(f, i * 0.2, 0.3, 'sawtooth', 0.14)); break;
      }
    } catch (e) { /* audio is optional */ }
  }
};

/* =====================================================================
   10. MAIN LOOP AND STARTUP
   ===================================================================== */
let simAccumulator = 0, lastFrame = 0;

function isPaused() { return !!UI.dialog || UI.rotate || UI.screen !== 'game'; }

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(CONFIG.maxFrameTime, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (UI.screen !== 'game' || !G) return;
  if (!isPaused()) {
    simAccumulator += dt;
    while (simAccumulator >= CONFIG.simStep && G && !G.over) {
      update(CONFIG.simStep);
      simAccumulator -= CONFIG.simStep;
    }
    handleEvents();
    if (!G) return;
  }
  render();
  updateHud();
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
document.addEventListener('visibilitychange', () => {
  if (document.hidden && UI.screen === 'game') { cancelDrag(); releasePointer(); openPause(); }
});

Save.load();
applyStaticStrings();
showScreen('menu');
resize();
requestAnimationFrame(now => { lastFrame = now; requestAnimationFrame(frame); });
</script>

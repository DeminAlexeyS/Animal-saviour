<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c5a2c">
<title>Animal Conservation</title>
<style>
  :root {
    --pt: max(8px, env(safe-area-inset-top, 0px));
    --pr: max(8px, env(safe-area-inset-right, 0px));
    --pb: max(8px, env(safe-area-inset-bottom, 0px));
    --pl: max(8px, env(safe-area-inset-left, 0px));
    --paper: #f6ecd0;
    --ink: #3b2a14;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; position: fixed; inset: 0; overflow: hidden;
    background: #2c5a2c; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #game { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }

  /* ---------- Buttons ---------- */
  .btn {
    min-width: 48px; min-height: 48px; padding: 0 14px; margin: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 12px; border: 2px solid rgba(0,0,0,.4);
    background: var(--paper); color: var(--ink);
    font-family: inherit; font-weight: 700; font-size: 15px; line-height: 1; white-space: nowrap;
    box-shadow: 0 3px 0 rgba(0,0,0,.35); touch-action: none; cursor: pointer;
  }
  .btn.primary { background: #5fb53c; color: #fff; }
  .btn.active { background: #ffd34d; border-color: #a86b00; }
  .btn.disabled, .btn:disabled { opacity: .45; }

  /* ---------- Menu screens ---------- */
  .screen {
    position: absolute; inset: 0; padding: var(--pt) var(--pr) var(--pb) var(--pl);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(#4a9a3f, #2a622a);
  }
  .screen h1 { margin: 0 0 6px; font-size: 30px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .screen h2 { margin: 0; font-size: 22px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .screen .back { position: absolute; left: var(--pl); top: var(--pt); }
  #menuButtons { display: flex; gap: 14px; }
  #menuButtons .btn { min-width: 130px; min-height: 60px; font-size: 18px; }
  #levelLine { display: flex; align-items: center; }
  .node {
    width: 64px; height: 64px; border-radius: 50%; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); font-weight: 800; font-size: 24px;
    border: 3px solid rgba(0,0,0,.45); box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer;
  }
  .node.done { background: #5fb53c; color: #fff; }
  .node.locked { background: #5a6a5a; color: #cfd8cf; box-shadow: none; }
  .node .check {
    position: absolute; right: -6px; top: -6px; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; color: #2e7d32; font-size: 17px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #2e7d32;
  }
  .link { width: 5vw; max-width: 44px; height: 6px; background: rgba(255,255,255,.4); }
  #beastGrid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 92vw; }
  .beast {
    width: 86px; height: 92px; border-radius: 14px; background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 2px solid rgba(0,0,0,.4); box-shadow: 0 3px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .beast .em { line-height: 0; }
  .beast.locked { background: #66705f; color: #dfe6da; box-shadow: none; }
  .beast.locked .em { filter: brightness(0); opacity: .75; }

  /* ---------- In-level HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  /* Animal list: always visible on the left. Button size comes from CONFIG.animalButtonSize. */
  #panel {
    position: absolute; left: var(--pl); top: var(--pt); max-height: calc(100% - var(--pt) - var(--pb));
    display: flex; flex-direction: column; gap: 6px; padding: 0 3px 5px 0;
    overflow-x: hidden; overflow-y: auto; scrollbar-width: none; border-radius: 12px;
  }
  #panel::-webkit-scrollbar { display: none; }
  .icon {
    position: relative; flex: 0 0 auto; width: var(--icon, 56px); height: calc(var(--icon, 56px) * 0.93);
    border-radius: 10px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding-bottom: calc(var(--icon, 56px) * 0.1);
    background: var(--paper); border: 2px solid rgba(0,0,0,.4); box-shadow: 0 3px 0 rgba(0,0,0,.35);
    touch-action: none; cursor: grab;
  }
  #panel.hot .icon { background: #9be07a; }
  .icon canvas { pointer-events: none; }
  .badge {
    position: absolute; right: 2px; bottom: 2px; padding: 1px 5px; border-radius: 8px;
    font-size: calc(var(--icon, 56px) * 0.215); font-weight: 800; line-height: 1.2; background: #2e7d32; color: #fff;
  }
  .badge.price { background: #b07a09; }
  #menuAnimals { display: flex; gap: 6px; align-items: flex-end; }
  /* Pen buttons on the right side */
  #btnEdit { position: absolute; right: var(--pr); top: 50%; transform: translateY(-50%); }
  #btnPen { position: absolute; right: var(--pr); bottom: var(--pb); }

  #topCenter { position: absolute; left: 50%; top: var(--pt); transform: translateX(-50%); width: min(38vw, 260px); text-align: center; pointer-events: none !important; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  #wbRow { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; }
  #wbNum { min-width: 30px; text-align: right; }
  #wbBar { flex: 1; height: 14px; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,.5); border: 2px solid rgba(0,0,0,.5); }
  #wbFill { height: 100%; width: 100%; background: #5bc236; }
  #goal { margin-top: 3px; font-size: 14px; font-weight: 700; }

  #topRight { position: absolute; right: var(--pr); top: var(--pt); display: flex; gap: 8px; align-items: center; pointer-events: none !important; }
  #money { position: relative; height: 48px; padding: 0 12px; border-radius: 12px; background: rgba(0,0,0,.5); display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; }
  #btnPause { pointer-events: auto; padding: 0; font-size: 20px; }
  .floater { position: absolute; right: 10px; top: 100%; color: #ffe36e; font-weight: 800; font-size: 16px; text-shadow: 0 1px 2px #000; animation: floatUp 1.5s ease-out forwards; pointer-events: none; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(8px); } to { opacity: 0; transform: translateY(-22px); } }

  #sell {
    position: absolute; right: var(--pr); bottom: var(--pb); width: 76px; height: 76px; border-radius: 50%;
    background: #c0392b; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; line-height: 1;
    transition: transform .1s;
  }
  #sell small { font-size: 12px; font-weight: 800; margin-top: 2px; }
  #sell.hot { transform: scale(1.18); background: #e74c3c; }
  #trash { position: absolute; transform: translate(-50%, -50%); padding: 0; font-size: 22px; background: #e2574c; }
  #toast {
    position: absolute; left: 50%; bottom: var(--pb); transform: translateX(-50%); max-width: 60vw;
    background: rgba(0,0,0,.78); padding: 8px 14px; border-radius: 10px; font-size: 14px; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none !important;
  }
  #toast.show { opacity: 1; }

  /* ---------- Dialogs ---------- */
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 8px; }
  #dialog {
    background: var(--paper); color: var(--ink); border-radius: 16px; padding: 14px 20px 16px;
    min-width: 270px; max-width: min(92vw, 460px); text-align: center;
    border: 3px solid rgba(0,0,0,.45); box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #dialog h2 { margin: 0 0 6px; font-size: 20px; }
  #dialog p { margin: 4px 0; font-size: 15px; }
  #dialog .big { font-size: 46px; line-height: 1.1; }
  #dialog .big canvas { display: block; margin: 0 auto; }
  .dlgBtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .dlgBtns .btn { min-width: 120px; }
  .sliderRow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .sliderRow .btn { padding: 0; font-size: 22px; }
  input[type=range] { flex: 1; width: 100%; height: 48px; margin: 0; accent-color: #5fb53c; }
  .optRow { display: flex; align-items: center; gap: 10px; margin-top: 6px; text-align: left; }
  .optRow label { width: 90px; font-weight: 700; }
  select { flex: 1; min-height: 48px; font: inherit; font-size: 16px; border-radius: 10px; padding: 0 8px; }

  #rotate {
    position: absolute; inset: 0; z-index: 100; background: #1d3b1d;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-size: 20px; font-weight: 700; text-align: center; padding: 20px;
  }
  #rotate .big { font-size: 64px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- In-level HUD (floats over the canvas) -->
<div id="hud" class="hidden">
  <div id="panel"></div>
  <div id="topCenter">
    <div id="wbRow"><span>❤️</span><span id="wbNum">100</span><div id="wbBar"><div id="wbFill"></div></div></div>
    <div id="goal"></div>
  </div>
  <div id="topRight">
    <div id="money"><span>💰</span><span id="moneyVal">0</span></div>
    <button id="btnPause" class="btn">⏸</button>
  </div>
  <button id="btnEdit" class="btn"><span>✏️</span><span data-i18n="btn_edit"></span></button>
  <button id="btnPen" class="btn"><span>🔨</span><span data-i18n="btn_new_pen"></span></button>
  <div id="sell" class="hidden"><span>💰</span><small data-i18n="sell"></small></div>
  <button id="trash" class="btn hidden">🗑️</button>
  <div id="toast"></div>
</div>

<!-- Menu screens -->
<div id="menu" class="screen">
  <h1 data-i18n="title"></h1>
  <div id="menuAnimals"></div>
  <div id="menuButtons">
    <button id="btnLevels" class="btn primary" data-i18n="menu_levels"></button>
    <button id="btnOptions" class="btn" data-i18n="menu_options"></button>
    <button id="btnBestiary" class="btn" data-i18n="menu_bestiary"></button>
  </div>
</div>
<div id="levels" class="screen hidden">
  <button class="btn back" data-back="1">◀ <span data-i18n="back"></span></button>
  <h2 data-i18n="menu_levels"></h2>
  <div id="levelLine"></div>
</div>
<div id="bestiary" class="screen hidden">
  <button class="btn back" data-back="1">◀ <span data-i18n="back"></span></button>
  <h2 data-i18n="menu_bestiary"></h2>
  <div id="beastGrid"></div>
</div>

<!-- Dialog layer (one dialog at a time) -->
<div id="overlay" class="hidden"><div id="dialog"></div></div>

<!-- Portrait blocker -->
<div id="rotate" class="hidden"><div class="big">📱↻</div><div data-i18n="rotate"></div></div>

<script>
'use strict';

/* =====================================================================
   1. CONFIG — every tunable number lives here
   ===================================================================== */
const CONFIG = {
  saveKey: 'animalConservation.save.v1',

  // Simulation
  simStep: 1 / 30,            // fixed time step (seconds)
  maxFrameTime: 0.25,         // clamp for long frames (tab switch etc.)

  // Economy
  donationInterval: 5,        // seconds between donation ticks
  penCostPerCell: 5,
  penShrinkRefund: 0.5,       // share of the price difference paid back when a pen shrinks
  sellFactorAdult: 0.6,
  sellFactorBaby: 0.3,
  babyIncomeFactor: 0.5,
  varietyBonus: 0.15,         // per extra species in pens
  moodBase: 0.5,              // mood = moodBase + moodRange * wellBeing/100
  moodRange: 0.5,

  // Well-being
  wellBeingStart: 100,
  wellBeingMax: 100,
  wellBeingFall: 0.2,         // per second with one unhappy pen
  wellBeingFallExtra: 0.5,    // extra factor per additional unhappy pen
  crowdSeverity: 1,           // every animal over a pen's capacity counts like this many extra unhappy pens
  wellBeingRise: 0.1,         // per second when nobody is unhappy
  wbYellowBelow: 60,
  wbRedBelow: 30,

  // Breeding and growth
  // A pen with 2 adults breeds every `breed` seconds (set per animal below). More adults breed faster:
  // interval = breed × 2 / adults, so 4 adults halve it and 6 adults cut it to a third.
  breedJitter: 0.2,           // each interval varies randomly by ±20 %
  breedMinInterval: 6,        // the interval never drops below this many seconds
  courtshipTime: 4,
  growTime: 60,
  babyCrowdWeight: 0.5,
  babyScale: 0.5,

  // Animal movement (in cells)
  wanderSpeed: 0.55,
  restMin: 2, restMax: 5,     // seconds an animal stands still
  actionChance: 0.6,          // chance that a standing animal plays its "action" animation (eating)
  actionMin: 1.5, actionMax: 3,   // how long the action lasts, in seconds
  walkMin: 3, walkMax: 7,     // seconds an animal keeps walking around
  penMargin: 0.3,             // animals keep this far from the fence

  // Feedback icons
  sadIconInterval: 1.3,
  sadIconLife: 1.6,
  sadIconSpeed: 0.55,         // cells per second upward

  // Input (CSS pixels)
  dragLift: 44,               // dragged item is drawn this far above a finger
  pickRadius: 26,             // how close a press must be to grab an animal
  handleRadius: 26,           // how close a press must be to grab a pen corner
  tapSlop: 10,                // movement below this still counts as a tap
  cornerRadiusMin: 14,        // grab zone around a pen corner in normal play
  cornerRadiusMax: 26,

  // Camera
  isoRatio: 0.56,             // tile height / tile width on screen; lower = camera closer to the ground
  maxZoom: 3,
  wheelZoomStep: 1.15,

  defaultVolume: 0.6,

  // UI
  animalButtonSize: 56,       // width of the animal buttons on the left, in CSS pixels (try 48 to 112)

  // Animals: price / income per donation tick / species they fear
  animalOrder: ['chicken', 'rabbit', 'deer', 'wolf', 'tiger', 'elephant'],
  // size  = how big the animal is drawn compared with the others
  // breed = seconds between births in a pen with 2 adults (the start interval; see "Breeding" above)
  // diet  = 'herbivore' animals get the built-in eating animation, 'predator' animals have none yet
  animals: {
    chicken:  { price: 20,  rate: 1,   fears: ['wolf', 'tiger'], size: 0.72, breed: 40, diet: 'herbivore' },
    rabbit:   { price: 30,  rate: 1.5, fears: ['wolf', 'tiger'], size: 0.8,  breed: 35, diet: 'herbivore' },
    deer:     { price: 60,  rate: 3,   fears: ['wolf', 'tiger'], size: 1.05, breed: 55, diet: 'herbivore' },
    wolf:     { price: 100, rate: 5,   fears: ['tiger'],         size: 0.95, breed: 65, diet: 'predator' },
    tiger:    { price: 200, rate: 10,  fears: [],                size: 1.05, breed: 75, diet: 'predator' },
    elephant: { price: 300, rate: 15,  fears: [],                size: 1.3,  breed: 90, diet: 'herbivore' }
  },
  animalDrawSize: 1.75,       // frame height of a size-1 adult, in tile edge lengths

  // ANIMAL ART — for the artist.
  // Every animal has three lists of image files (one file per animation frame, played in order and looped):
  //   idle   — standing still
  //   walk   — walking
  //   action — a short animation played now and then while standing (herbivores: eating grass;
  //            predators: nothing yet, so wolf and tiger simply stay idle until frames are added here)
  // While a list is empty the game draws its built-in placeholder.
  // Example:
  //   chicken: { idle: ['art/chicken_idle.png'],
  //              walk: ['art/chicken_walk1.png', 'art/chicken_walk2.png', 'art/chicken_walk3.png', 'art/chicken_walk4.png'],
  //              action: ['art/chicken_eat1.png', 'art/chicken_eat2.png'] },
  // Rules: transparent PNG (or WebP); all frames of one animal the same size; the animal stands with its
  // feet at the bottom centre of the image; every image looks in the direction given by "facing" and the
  // game mirrors it for the other direction. Paths are relative to index.html.
  art: {
    facing: 'right',          // direction the source images look: 'right' or 'left'
    walkFps: 8,               // walk frames per second
    idleFps: 2,               // idle frames per second
    actionFps: 3,             // action frames per second
    animals: {
      chicken:  { idle: [], walk: [], action: [] },
      rabbit:   { idle: [], walk: [], action: [] },
      deer:     { idle: [], walk: [], action: [] },
      wolf:     { idle: [], walk: [], action: [] },
      tiger:    { idle: [], walk: [], action: [] },
      elephant: { idle: [], walk: [], action: [] }
    },

    // SCENERY ART — same idea: list image files, an empty list keeps the built-in drawing.
    //   grass:        one or more ground tiles. Each image is one diamond-shaped tile filling the whole
    //                 image (corners at the middle of each side), width : height = 1 : isoRatio
    //                 (e.g. 200 × 112 px for isoRatio 0.56). With several images the tiles are mixed.
    //   trees:        one or more trees, trunk base at the bottom centre. Each tree picks one image.
    //   fenceSegment: ONE image of a fence section one tile long, running from upper-left to lower-right.
    //                 The image width equals half a tile width. The ground line of the fence starts on the
    //                 left side at (image width × isoRatio) above the bottom and ends in the bottom-right
    //                 corner. The game mirrors it for fences running the other way.
    //   fencePost:    ONE optional image of a post, base at the bottom centre, drawn at every tile corner
    //                 of a fence (leave empty if the posts are already part of fenceSegment).
    // Example:  grass: ['art/grass1.png', 'art/grass2.png'],  trees: ['art/oak.png', 'art/pine.png'],
    //           fenceSegment: ['art/fence.png'],  fencePost: ['art/post.png']
    scenery: { grass: [], trees: [], fenceSegment: [], fencePost: [] },
    treeHeight: 2.1,          // height of a tree image, in tile edge lengths
    fencePostHeight: 0.5      // height of a post image, in tile edge lengths
  },

  // Levels. goal.type is 'money' (reach amount) or 'animals' (adults of a species in pens)
  levels: [
    { cols: 8,  rows: 6,  money: 100, stock: { chicken: 2 },  species: ['chicken', 'rabbit'],
      goal: { type: 'money', amount: 300 } },
    { cols: 10, rows: 7,  money: 150, stock: { rabbit: 2 },   species: ['chicken', 'rabbit', 'deer'],
      goal: { type: 'animals', species: 'rabbit', amount: 15 } },
    { cols: 12, rows: 8,  money: 250, stock: { deer: 2 },     species: ['chicken', 'rabbit', 'deer', 'wolf'],
      goal: { type: 'money', amount: 1000 } },
    { cols: 14, rows: 9,  money: 400, stock: { wolf: 2 },     species: ['chicken', 'rabbit', 'deer', 'wolf', 'tiger'],
      goal: { type: 'animals', species: 'tiger', amount: 15 } },
    { cols: 16, rows: 10, money: 600, stock: { elephant: 2 }, species: ['chicken', 'rabbit', 'deer', 'wolf', 'tiger', 'elephant'],
      goal: { type: 'money', amount: 4000 } }
  ]
};

/* =====================================================================
   2. STRINGS — every visible text, keyed by id, one object per language
   ===================================================================== */
const STRINGS = {
  en: {
    lang_name: 'English',
    title: 'Animal Conservation',
    rotate: 'Please rotate your device',
    menu_levels: 'Levels', menu_options: 'Options', menu_bestiary: 'Bestiary',
    back: 'Back', menu: 'Menu',

    btn_edit: 'Edit', btn_new_pen: 'New pen', sell: 'Sell',

    level_n: 'Level {n}', start: 'Start',
    goal_money: 'Money {cur} / {goal}',
    goal_animals: 'Adult {animals} {cur} / {goal}',
    goal_money_desc: 'Goal: reach {goal} money.',
    goal_animals_desc: 'Goal: have {goal} adult {animals} in pens.',
    intro_hint: 'Keep well-being above 0.',
    intro_tip: 'Drag on empty grass to build a pen, drag a pen corner to resize it, pinch with two fingers to zoom.',

    pen_title: 'Build this pen?',
    pen_text: '{w} × {h} cells for {cost} money.',
    confirm: 'Confirm', cancel: 'Cancel',
    cost_label: '💰 {n}',
    refund_label: '+💰 {n}',

    buy_title: 'Buy {animal}',
    buy_each: '{price} money each',
    buy_total: '{n} × {animal} — total {total}',
    buy_none: "You can't afford any right now.",
    accept: 'Accept',

    sell_confirm: 'Sell this {animal} for {price}?',
    baby_of: 'baby {animal}',
    yes: 'Yes', no: 'No',

    win_title: 'Level complete!', win_text: 'You reached the goal.',
    win_all: 'You finished every level. Thank you for playing!',
    next_level: 'Next level',
    lose_title: 'Level lost', lose_text: 'Well-being dropped to 0.',
    restart: 'Restart',

    pause_title: 'Paused', resume: 'Resume', restart_level: 'Restart level',
    options: 'Options', quit: 'Quit to level select',
    opt_volume: 'Volume', opt_language: 'Language',

    locked: '???',
    best_fears: 'Fears: {list}', best_nothing: 'nothing',
    best_price: 'Price: {n}', best_income: 'Income: {n} per {s} s',

    toast_pen_mode: 'Drag on the field to draw a pen.',
    toast_edit_mode: 'Drag a corner to resize. Tap an empty pen to delete it.',
    toast_pen_not_empty: 'Move the animals out before deleting this pen.',

    name_chicken: 'Chicken',   names_chicken: 'Chickens',
    name_rabbit: 'Rabbit',     names_rabbit: 'Rabbits',
    name_deer: 'Deer',         names_deer: 'Deer',
    name_wolf: 'Wolf',         names_wolf: 'Wolves',
    name_tiger: 'Tiger',       names_tiger: 'Tigers',
    name_elephant: 'Elephant', names_elephant: 'Elephants',
    desc_chicken: 'A cheerful bird that is easy to keep and quick to win over visitors.',
    desc_rabbit: 'A gentle hopper that loves company and soft grass.',
    desc_deer: 'A graceful forest dweller that startles easily around predators.',
    desc_wolf: 'A clever pack hunter that makes smaller animals nervous.',
    desc_tiger: 'A powerful striped cat that fears nothing and frightens almost everyone.',
    desc_elephant: 'A calm giant with a long memory that draws the biggest crowds.'
  }
};

/** Look up a string by id in the current language and fill {placeholders}. */
function t(id, vars) {
  const dict = STRINGS[Save.data.lang] || STRINGS.en;
  let s = dict[id];
  if (s === undefined) s = STRINGS.en[id];
  if (s === undefined) s = id;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
  return s;
}

/* =====================================================================
   3. SAVE DATA — localStorage with in-memory fallback
   ===================================================================== */
const Save = {
  data: { unlocked: [0], completed: [], bestiary: [], volume: CONFIG.defaultVolume, lang: 'en' },

  load() {
    try {
      const raw = window.localStorage.getItem(CONFIG.saveKey);
      if (!raw) return;
      const d = JSON.parse(raw);
      const n = CONFIG.levels.length;
      const validLevel = i => Number.isInteger(i) && i >= 0 && i < n;
      if (Array.isArray(d.unlocked)) this.data.unlocked = d.unlocked.filter(validLevel);
      if (Array.isArray(d.completed)) this.data.completed = d.completed.filter(validLevel);
      if (Array.isArray(d.bestiary)) this.data.bestiary = d.bestiary.filter(s => CONFIG.animals[s]);
      if (typeof d.volume === 'number') this.data.volume = Math.min(1, Math.max(0, d.volume));
      if (typeof d.lang === 'string' && STRINGS[d.lang]) this.data.lang = d.lang;
      if (!this.data.unlocked.includes(0)) this.data.unlocked.push(0);
    } catch (e) { /* storage unavailable or corrupt: keep in-memory defaults */ }
  },

  store() {
    try { window.localStorage.setItem(CONFIG.saveKey, JSON.stringify(this.data)); }
    catch (e) { /* storage unavailable: progress lives in memory only */ }
  }
};

/* =====================================================================
   4. STATE
   ===================================================================== */
/** G is the level in progress (pure game data, no DOM). null outside a level. */
let G = null;

/** UI state: which screen, which mode, what the finger is doing. */
const UI = {
  screen: 'menu',     // 'menu' | 'levels' | 'bestiary' | 'game'
  mode: null,         // null | 'pen' | 'edit'
  dialog: null,       // the open dialog spec, or null
  rotate: false,      // portrait blocker visible
  drag: null,         // current drag gesture (see section 6)
  selectedPen: null,  // pen tapped in edit mode
  pendingPen: null    // rectangle waiting in the pen confirm dialog
};

/* =====================================================================
   5. GAME LOGIC — no DOM or canvas access in this section
   ===================================================================== */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function newLevelState(idx) {
  const L = CONFIG.levels[idx];
  const stock = {};
  for (const sp of L.species) stock[sp] = { adults: L.stock[sp] || 0, babies: [] };
  return {
    levelIdx: idx, level: L, cols: L.cols, rows: L.rows,
    money: L.money, wellBeing: CONFIG.wellBeingStart,
    pens: [], stock, particles: [], events: [],
    donationT: 0, time: 0, nextId: 1,
    over: null                 // null | 'win' | 'lose'
  };
}

/* ----- rectangles (all in whole cells: x, y, w, h) ----- */
function rectFromCells(ax, ay, bx, by) {
  return { x: Math.min(ax, bx), y: Math.min(ay, by), w: Math.abs(ax - bx) + 1, h: Math.abs(ay - by) + 1 };
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
/** True when two non-overlapping rectangles touch along an edge or at a corner. */
function rectsTouch(a, b) {
  return a.x <= b.x + b.w && b.x <= a.x + a.w && a.y <= b.y + b.h && b.y <= a.y + a.h;
}
function rectInField(r) {
  return r.x >= 0 && r.y >= 0 && r.x + r.w <= G.cols && r.y + r.h <= G.rows;
}
function overlapsAnyPen(r, except) {
  for (const p of G.pens) if (p !== except && rectsOverlap(r, p)) return true;
  return false;
}
function penAtCell(cx, cy) {
  for (const p of G.pens) if (cx >= p.x && cx < p.x + p.w && cy >= p.y && cy < p.y + p.h) return p;
  return null;
}

/* ----- pens ----- */
const penCost = cells => cells * CONFIG.penCostPerCell;
function penSpecies(p) { return p.animals.length ? p.animals[0].species : null; }
/** Animal count for crowding: adults count 1, babies 0.5. */
function penLoad(p) {
  let n = 0;
  for (const a of p.animals) n += a.adult ? 1 : CONFIG.babyCrowdWeight;
  return n;
}
function penAccepts(p, species) { const s = penSpecies(p); return s === null || s === species; }

/** A new pen is valid when it is inside the field, overlaps nothing and is affordable. */
function checkNewPen(r) {
  const cost = penCost(r.w * r.h);
  return { cost, valid: rectInField(r) && !overlapsAnyPen(r, null) && cost <= G.money };
}
function createPen(r) {
  const info = checkNewPen(r);
  if (!info.valid) return null;
  G.money -= info.cost;
  const pen = { id: G.nextId++, x: r.x, y: r.y, w: r.w, h: r.h, animals: [],
                crowded: false, scared: false, severity: 0, breedT: null, court: null, sadT: 0 };
  G.pens.push(pen);
  return pen;
}
/** Resizing: growing charges for the added cells, shrinking pays back part of the price difference. */
function checkResize(pen, orig, r) {
  const diff = r.w * r.h - orig.w * orig.h;
  const cost = diff > 0 ? penCost(diff) : 0;
  const refund = diff < 0 ? penCost(-diff) * CONFIG.penShrinkRefund : 0;
  return { cost, refund, valid: rectInField(r) && !overlapsAnyPen(r, pen) && cost <= G.money };
}
function deletePen(pen) {
  if (pen.animals.length) return false;
  G.pens.splice(G.pens.indexOf(pen), 1);
  return true;
}

/* ----- animals and stock ----- */
function makeAnimal(species, adult, age, x, y) {
  return { id: G.nextId++, species, adult, age, x, y, tx: x, ty: y,
           walking: false, timer: rand(0.3, CONFIG.restMin), held: false,
           face: Math.random() < 0.5 ? 1 : -1,   // 1 = looking right on screen, -1 = left
           moving: false,                        // true while it actually changes position (walk animation)
           acting: false, restT: 0, actStart: 0, actEnd: 0 };   // "action" animation while standing (eating)
}
function stockCount(sp) { const s = G.stock[sp]; return s ? s.adults + s.babies.length : 0; }
/** What the next animal taken from stock would be (adults first, then babies). */
function peekStock(sp) {
  const s = G.stock[sp];
  if (!s) return null;
  if (s.adults > 0) return { adult: true, age: CONFIG.growTime };
  if (s.babies.length) return { adult: false, age: s.babies[s.babies.length - 1] };
  return null;
}
function takeFromStock(sp) {
  const next = peekStock(sp);
  if (!next) return null;
  if (next.adult) G.stock[sp].adults--; else G.stock[sp].babies.pop();
  return next;
}
function clampToPen(p, a) {
  const m = CONFIG.penMargin;
  a.x = clamp(a.x, p.x + m, p.x + p.w - m);  a.y = clamp(a.y, p.y + m, p.y + p.h - m);
  a.tx = clamp(a.tx, p.x + m, p.x + p.w - m); a.ty = clamp(a.ty, p.y + m, p.y + p.h - m);
}
/** Move one animal from stock into a pen at field position (fx, fy). */
function placeFromStock(sp, pen, fx, fy) {
  if (!penAccepts(pen, sp)) return false;
  const next = takeFromStock(sp);
  if (!next) return false;
  const a = makeAnimal(sp, next.adult, next.age, fx, fy);
  clampToPen(pen, a);
  pen.animals.push(a);
  return true;
}
/** Seconds between births for a pen: the species' start interval, shorter with every extra adult. */
function breedInterval(species, adults) {
  return Math.max(CONFIG.breedMinInterval, CONFIG.animals[species].breed * 2 / Math.max(2, adults));
}
function cancelCourtship(pen) { pen.court = null; pen.breedT = null; }
function removeFromPen(pen, a) {
  const i = pen.animals.indexOf(a);
  if (i < 0) return false;
  pen.animals.splice(i, 1);
  if (pen.court && (pen.court.a === a || pen.court.b === a)) cancelCourtship(pen);
  return true;
}
/** Move an animal straight into another pen (empty or same species). */
function moveAnimal(from, to, a, fx, fy) {
  if (from === to || !penAccepts(to, a.species)) return false;
  if (!removeFromPen(from, a)) return false;
  a.x = a.tx = fx; a.y = a.ty = fy;
  clampToPen(to, a);
  to.animals.push(a);
  return true;
}
function returnToStock(pen, a) {
  if (!removeFromPen(pen, a)) return;
  if (a.adult) G.stock[a.species].adults++; else G.stock[a.species].babies.push(a.age);
}
function sellValue(species, adult) {
  return Math.round(CONFIG.animals[species].price * (adult ? CONFIG.sellFactorAdult : CONFIG.sellFactorBaby));
}
function sellFromPen(pen, a) {
  if (!removeFromPen(pen, a)) return;
  G.money += sellValue(a.species, a.adult);
}
function sellFromStock(sp) {
  const next = takeFromStock(sp);
  if (next) G.money += sellValue(sp, next.adult);
}
function maxAffordable(sp) { return Math.floor(G.money / CONFIG.animals[sp].price + 1e-9); }
function buyAnimals(sp, n) {
  const cost = n * CONFIG.animals[sp].price;
  if (n < 1 || cost > G.money + 1e-9) return false;
  G.money -= cost;
  G.stock[sp].adults += n;
  return true;
}

/* ----- economy ----- */
function computeIncome() {
  let sum = 0;
  const species = new Set();
  for (const p of G.pens) for (const a of p.animals) {
    sum += CONFIG.animals[a.species].rate * (a.adult ? 1 : CONFIG.babyIncomeFactor);
    species.add(a.species);
  }
  if (!species.size) return 0;
  const variety = 1 + CONFIG.varietyBonus * (species.size - 1);
  const mood = CONFIG.moodBase + CONFIG.moodRange * (G.wellBeing / CONFIG.wellBeingMax);
  return sum * variety * mood;
}

/* ----- goals ----- */
function goalProgress() {
  const g = G.level.goal;
  if (g.type === 'money') return { cur: G.money, target: g.amount };
  let n = 0;
  for (const p of G.pens) for (const a of p.animals) if (a.adult && a.species === g.species) n++;
  return { cur: n, target: g.amount };
}

/* ----- unhappiness ----- */
function updatePenStatus() {
  for (const p of G.pens) {
    const over = penLoad(p) - p.w * p.h;        // animals above capacity (a baby counts 0.5)
    p.crowded = over > 0;
    p.scared = false;
    p.severity = 0;                             // how unhappy the pen is: 0 = fine, 1 = one "unhappy pen", more = worse
    if (p.crowded) p.severity = Math.max(1, over * CONFIG.crowdSeverity);
    const sp = penSpecies(p);
    if (!sp) continue;
    const fears = CONFIG.animals[sp].fears;
    if (!fears.length) continue;
    for (const q of G.pens) {
      if (q === p) continue;
      const qs = penSpecies(q);
      if (qs && fears.includes(qs) && rectsTouch(p, q)) { p.scared = true; p.severity = Math.max(1, p.severity); break; }
    }
  }
}

/* ----- per-pen simulation: growth, breeding, wandering, sad icons ----- */
function updatePen(p, dt) {
  const C = CONFIG;

  // Growth
  let adults = 0;
  for (const a of p.animals) {
    if (!a.adult) { a.age += dt; if (a.age >= C.growTime) a.adult = true; }
    if (a.adult) adults++;
  }

  // Breeding
  const eligible = adults >= 2 && !p.scared;   // crowded pens keep breeding; only fear stops it
  if (!eligible) {
    p.breedT = null; p.court = null;
  } else if (p.court) {
    p.court.t += dt;
    if (p.court.t >= C.courtshipTime) {
      const c = p.court;
      const baby = makeAnimal(c.a.species, false, 0, (c.a.x + c.b.x) / 2, (c.a.y + c.b.y) / 2 + 0.3);
      clampToPen(p, baby);
      p.animals.push(baby);
      p.court = null; p.breedT = null;
      G.events.push({ type: 'birth' });
    }
  } else {
    // breedT counts down from about 1 to 0; its speed follows the current number of adults,
    // so adding or removing adults speeds the running timer up or slows it down straight away
    if (p.breedT === null) p.breedT = rand(1 - C.breedJitter, 1 + C.breedJitter);
    p.breedT -= dt / breedInterval(penSpecies(p), adults);
    if (p.breedT <= 0) {
      const free = p.animals.filter(a => a.adult && !a.held);
      if (free.length >= 2) {
        const i = Math.floor(Math.random() * free.length);
        let j = Math.floor(Math.random() * (free.length - 1));
        if (j >= i) j++;
        p.court = { a: free[i], b: free[j], t: 0 };
      }
    }
  }

  // Wandering (the courting pair walks toward each other instead)
  const c = p.court;
  for (const a of p.animals) {
    if (a.held) continue;
    let tx, ty, speed = C.wanderSpeed, courting = false;
    if (c && (a === c.a || a === c.b)) {
      const other = a === c.a ? c.b : c.a;
      const side = a === c.a ? -0.22 : 0.22;
      tx = (a.x + other.x) / 2 + side; ty = (a.y + other.y) / 2;
      speed *= 2; courting = true; a.acting = false;
    } else {
      // Alternate between standing still and walking around for a few seconds each.
      a.timer -= dt;
      if (a.timer <= 0) {
        a.walking = !a.walking;
        a.timer = a.walking ? rand(C.walkMin, C.walkMax) : rand(C.restMin, C.restMax);
        if (a.walking) { a.tx = rand(p.x, p.x + p.w); a.ty = rand(p.y, p.y + p.h); }
        else {                                   // starting a rest: maybe play the action during it
          a.restT = 0; a.actEnd = 0;
          if (Math.random() < C.actionChance) {
            a.actStart = rand(0.3, 0.8);
            a.actEnd = Math.min(a.timer - 0.3, a.actStart + rand(C.actionMin, C.actionMax));
          }
        }
      }
      if (a.walking) a.acting = false;
      else { a.restT += dt; a.acting = a.restT >= a.actStart && a.restT < a.actEnd; }
      if (a.walking) { tx = a.tx; ty = a.ty; } else { tx = a.x; ty = a.y; }
    }
    const dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy), step = speed * dt;
    a.moving = dist > 1e-4;
    // On screen, field x points down-right and field y down-left, so "right" means dx > dy.
    if (a.moving && Math.abs(dx - dy) > 0.02) a.face = dx > dy ? 1 : -1;
    if (dist <= step) {
      a.x = tx; a.y = ty;
      if (!courting && a.walking) { a.tx = rand(p.x, p.x + p.w); a.ty = rand(p.y, p.y + p.h); }   // next waypoint
    } else { a.x += dx / dist * step; a.y += dy / dist * step; }
    clampToPen(p, a);   // also keeps animals inside after a resize
  }

  // Sad icons
  if (p.crowded || p.scared) {
    p.sadT -= dt;
    if (p.sadT <= 0) {
      p.sadT = C.sadIconInterval / Math.min(4, p.severity || 1);   // unhappier pens show more sad faces
      const kind = p.crowded && p.scared ? (Math.random() < 0.5 ? 'crowd' : 'fear') : (p.crowded ? 'crowd' : 'fear');
      G.particles.push({ kind, x: rand(p.x + 0.3, p.x + p.w - 0.3), y: rand(p.y + 0.3, p.y + p.h - 0.3), z: 0, life: C.sadIconLife });
    }
  } else p.sadT = 0;
}

/** Advance the whole simulation by one fixed step. */
function update(dt) {
  if (G.over) return;
  const C = CONFIG;
  G.time += dt;

  // Well-being
  updatePenStatus();
  // "unhappy" adds up the severity of all pens: a scared or slightly crowded pen counts 1,
  // a pen that is several animals over capacity counts once per extra animal.
  let unhappy = 0, animals = 0;
  for (const p of G.pens) { unhappy += p.severity; animals += p.animals.length; }
  if (unhappy > 0) G.wellBeing -= C.wellBeingFall * (1 + C.wellBeingFallExtra * (unhappy - 1)) * dt;
  else if (animals > 0) G.wellBeing = Math.min(C.wellBeingMax, G.wellBeing + C.wellBeingRise * dt);
  if (G.wellBeing <= 0) {
    G.wellBeing = 0; G.over = 'lose'; G.events.push({ type: 'lose' });
    return;
  }

  // Donations
  G.donationT += dt;
  if (G.donationT >= C.donationInterval) {
    G.donationT -= C.donationInterval;
    const income = computeIncome();
    if (income > 0) { G.money += income; G.events.push({ type: 'donation', amount: income }); }
  }

  for (const p of G.pens) updatePen(p, dt);

  // Floating sad icons
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const s = G.particles[i];
    s.life -= dt; s.z += C.sadIconSpeed * dt;   // z = height above the ground, in cells
    if (s.life <= 0) G.particles.splice(i, 1);
  }

  checkWin();
}

/** Win triggers the moment the goal is met (also called right after player actions). */
function checkWin() {
  if (G.over) return;
  const g = goalProgress();
  if (g.cur >= g.target) { G.over = 'win'; G.events.push({ type: 'win' }); }
}

/* =====================================================================
   6. INPUT — Pointer Events, one finger only
   ===================================================================== */
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');

const Input = { pid: null, type: '', lift: 0, x: 0, y: 0,     // first finger (or mouse)
                pid2: null, x2: 0, y2: 0, pinch: null };          // second finger: zoom and pan
let tapCandidate = null;   // element that received the current pointerdown (see onTap)

function releasePointer() { endPinch(); Input.pid = null; tapCandidate = null; }
function canMoveCamera() { return UI.screen === 'game' && !UI.dialog && !UI.rotate && !!G && !G.over; }

/* ----- two-finger zoom and pan ----- */
function startPinch() {
  cancelDrag(); tapCandidate = null;          // a second finger cancels whatever the first was doing
  const f = toField((Input.x + Input.x2) / 2, (Input.y + Input.y2) / 2);
  Input.pinch = { dist: Math.max(10, Math.hypot(Input.x - Input.x2, Input.y - Input.y2)), zoom: View.zoom,
                  fx: f.fx, fy: f.fy };   // field point under the fingers
}
function updatePinch() {
  const p = Input.pinch;
  if (!p || !G) return;
  const cx = (Input.x + Input.x2) / 2, cy = (Input.y + Input.y2) / 2;
  const dist = Math.hypot(Input.x - Input.x2, Input.y - Input.y2);
  setCamera(p.zoom * dist / p.dist, cx, cy, p.fx, p.fy);   // the grabbed field point follows the fingers
}
function endPinch() { Input.pinch = null; Input.pid2 = null; }

// Capture phase: the first pointer plays, a second touch zooms/pans, everything else is swallowed.
window.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (e.pointerType === 'mouse' && e.button !== 0) {
    e.stopImmediatePropagation();
    if (Input.pid === null && e.target === canvas && canMoveCamera()) {   // right/middle mouse drag pans
      Input.pid = e.pointerId; Input.type = 'mouse';
      UI.drag = { kind: 'pan', px: e.clientX, py: e.clientY };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
    }
    return;
  }
  if (Input.pid !== null && e.pointerId !== Input.pid) {
    if (!e.isPrimary) {
      e.stopImmediatePropagation(); e.preventDefault();
      if (Input.pid2 === null && e.pointerType === 'touch' && Input.type === 'touch' && canMoveCamera()) {
        Input.pid2 = e.pointerId; Input.x2 = e.clientX; Input.y2 = e.clientY;
        startPinch();
      }
      return;
    }
    cancelDrag(); endPinch();   // the old pointer vanished without an "up"; start over
  }
  Input.pid = e.pointerId; Input.type = e.pointerType;
  Input.x = e.clientX; Input.y = e.clientY;
  Input.lift = e.pointerType === 'mouse' ? 0 : CONFIG.dragLift;
  tapCandidate = null;
}, true);
window.addEventListener('pointermove', e => {
  if (e.pointerId === Input.pid) {
    Input.x = e.clientX; Input.y = e.clientY;
    if (Input.pinch) { updatePinch(); e.stopImmediatePropagation(); }
  } else {
    if (e.pointerId === Input.pid2) { Input.x2 = e.clientX; Input.y2 = e.clientY; updatePinch(); }
    e.stopImmediatePropagation();
  }
}, true);
for (const type of ['pointerup', 'pointercancel']) {
  window.addEventListener(type, e => {
    if (e.pointerId === Input.pid) return;            // handled in the bubble phase below
    if (e.pointerId === Input.pid2) endPinch();
    e.stopImmediatePropagation();
  }, true);
}
// Bubble phase: drive the current drag gesture.
window.addEventListener('pointermove', e => dragMove(e.clientX, e.clientY));
window.addEventListener('pointerup', e => { dragEnd(e.clientX, e.clientY); releasePointer(); });
window.addEventListener('pointercancel', () => { cancelDrag(); releasePointer(); });
window.addEventListener('blur', () => { cancelDrag(); releasePointer(); });

// Block scrolling, zooming, selection and the context menu.
document.addEventListener('touchmove', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); }, { passive: false });
for (const type of ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart', 'dblclick', 'dragstart']) {
  document.addEventListener(type, e => e.preventDefault());
}
window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
// Mouse wheel (or trackpad pinch) zooms around the cursor.
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!canMoveCamera()) return;
  const f = toField(e.clientX, e.clientY), k = e.deltaY < 0 ? CONFIG.wheelZoomStep : 1 / CONFIG.wheelZoomStep;
  setCamera(View.zoom * k, e.clientX, e.clientY, f.fx, f.fy);
}, { passive: false });

/** Tap handler built on pointer events so it obeys the one-finger rule. */
function onTap(el, fn) {
  el.addEventListener('pointerdown', () => { tapCandidate = el; });
  el.addEventListener('pointerup', e => {
    if (tapCandidate !== el) return;
    tapCandidate = null;
    if (el.disabled) return;
    const r = el.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) fn(e);
  });
  el.addEventListener('click', e => { if (e.detail === 0 && !el.disabled) fn(e); });   // keyboard activation
}

function pointIn(el, x, y) {
  const r = el.getBoundingClientRect();
  return r.width > 0 && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}
/** Screen pixels -> field coordinates (fx, fy in cells; cx, cy whole cell indices). */
function toField(px, py) {
  const F = View.field;
  const a = (px - F.ox) / (F.tw / 2), b = (py - F.oy) / (F.th / 2);   // inverse of sx()/sy()
  const fx = (a + b) / 2, fy = (b - a) / 2;
  return { fx, fy, cx: Math.floor(fx), cy: Math.floor(fy) };
}
const cellInField = (cx, cy) => cx >= 0 && cy >= 0 && cx < G.cols && cy < G.rows;

/* ----- what is under the finger ----- */
function findAnimal(px, py) {
  const c = View.field.cell;
  const f1 = toField(px, py), f2 = toField(px, py + c * 0.4);      // the body is drawn above the feet
  const u1 = penAtCell(f1.cx, f1.cy), u2 = penAtCell(f2.cx, f2.cy);
  const inside = Math.max(CONFIG.pickRadius, c * 0.5), outside = c * 0.35;
  let best = null;
  for (const p of G.pens) {
    const limit = (p === u1 || p === u2) ? inside : outside;   // be strict when the finger is not on the animal's pen
    for (const a of p.animals) {
      const lift = animalBox(a.species) * animalScale(a) * 0.3;     // aim at the body centre
      const d = Math.hypot(sx(a.x, a.y) - px, sy(a.x, a.y) - lift - py);
      if (d < limit && (!best || d < best.dist)) best = { pen: p, animal: a, dist: d };
    }
  }
  return best;
}
/** Screen positions of a pen's four corner handles (drawn slightly inside the pen). */
function handlePoints(p) {
  const i = Math.min(0.3, 12 / View.field.cell);
  const x0 = p.x + i, x1 = p.x + p.w - i, y0 = p.y + i, y1 = p.y + p.h - i;
  // each handle remembers the cell of the opposite (fixed) corner
  const H = (x, y, fx, fy) => ({ x: sx(x, y), y: sy(x, y), fx, fy });
  return [
    H(x0, y0, p.x + p.w - 1, p.y + p.h - 1),
    H(x1, y0, p.x,           p.y + p.h - 1),
    H(x0, y1, p.x + p.w - 1, p.y),
    H(x1, y1, p.x,           p.y)
  ];
}
function findHandle(px, py) {
  let best = null, bestD = CONFIG.handleRadius;
  for (const p of G.pens) for (const h of handlePoints(p)) {
    const d = Math.hypot(h.x - px, h.y - py);
    if (d < bestD) { bestD = d; best = { pen: p, fx: h.fx, fy: h.fy }; }
  }
  return best;
}

/** Normal play: a press inside a pen, close to one of its corners, grabs that corner. */
function findCorner(px, py) {
  const c = View.field.cell, f = toField(px, py), p = penAtCell(f.cx, f.cy);
  if (!p) return null;
  const r = Math.min(clamp(c * 0.4, CONFIG.cornerRadiusMin, CONFIG.cornerRadiusMax), c * 0.45);
  const xs = [p.x, p.x + p.w], ys = [p.y, p.y + p.h];
  const hs = handlePoints(p);
  let best = null;
  for (let i = 0; i < 4; i++) {
    const d = Math.hypot(sx(xs[i % 2], ys[i >> 1]) - px, sy(xs[i % 2], ys[i >> 1]) - py);
    if (d < r && (!best || d < best.dist)) best = { pen: p, fx: hs[i].fx, fy: hs[i].fy, dist: d };
  }
  return best;
}

/* ----- starting a gesture ----- */
canvas.addEventListener('pointerdown', e => {
  if (!canMoveCamera()) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
  const px = e.clientX, py = e.clientY, f = toField(px, py);
  const inField = cellInField(f.cx, f.cy), emptyCell = inField && !penAtCell(f.cx, f.cy);

  // armed = the preview shows at once (New pen button); otherwise only after the finger slides
  const startPen = armed => {
    UI.drag = { kind: 'newpen', sx: f.cx, sy: f.cy, cx: f.cx, cy: f.cy, px0: px, py0: py, armed };
  };
  const startCorner = h => {
    const p = h.pen;
    UI.selectedPen = null;
    UI.drag = { kind: 'corner', pen: p, fx: h.fx, fy: h.fy, orig: { x: p.x, y: p.y, w: p.w, h: p.h },
                rect: { x: p.x, y: p.y, w: p.w, h: p.h }, valid: true, cost: 0, refund: 0 };
  };

  if (UI.mode === 'pen') { if (inField) startPen(true); return; }
  if (UI.mode === 'edit') {
    const h = findHandle(px, py);
    if (h) startCorner(h);
    else if (emptyCell) startPen(false);
    else UI.drag = { kind: 'tap', sx: px, sy: py, pen: penAtCell(f.cx, f.cy) };
    return;
  }

  // Normal play: grab an animal, grab a pen corner, or start a new pen on empty grass.
  const hit = findAnimal(px, py), corner = findCorner(px, py);
  if (hit && (!corner || hit.dist <= corner.dist)) {
    hit.animal.held = true; hit.animal.moving = false; hit.animal.acting = false;
    if (hit.pen.court && (hit.pen.court.a === hit.animal || hit.pen.court.b === hit.animal)) cancelCourtship(hit.pen);
    UI.drag = { kind: 'animal', pen: hit.pen, animal: hit.animal, species: hit.animal.species, px, py };
    Sound.play('tap');
  } else if (corner) startCorner(corner);
  else if (emptyCell) startPen(false);
});

/** Called from the panel: press on a species icon. */
function startStockDrag(sp, e, iconEl) {
  if (UI.dialog || !G || G.over) return;
  try { iconEl.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
  const next = peekStock(sp);
  UI.drag = { kind: 'stock', species: sp, has: !!next, adult: next ? next.adult : true, age: next ? next.age : 0,
              sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY,
              phase: 'press' };   // 'press' -> 'scroll' (sliding the icon column) or 'carry' (dragging the animal out)
  if (next) Sound.play('tap');
}

/* ----- during a gesture ----- */
function dragMove(px, py) {
  const d = UI.drag;
  if (!d || !G) return;
  if (d.kind === 'newpen') {
    const f = toField(px, py); d.cx = f.cx; d.cy = f.cy;
    if (!d.armed && Math.hypot(px - d.px0, py - d.py0) > CONFIG.tapSlop) d.armed = true;
  } else if (d.kind === 'pan') {
    View.field.ox += px - d.px; View.field.oy += py - d.py;
    d.px = px; d.py = py;
    clampCamera();
  } else if (d.kind === 'corner') {
    const f = toField(px, py);
    d.rect = rectFromCells(d.fx, d.fy, f.cx, f.cy);
    const info = checkResize(d.pen, d.orig, d.rect);
    d.valid = info.valid; d.cost = info.cost; d.refund = info.refund;
    // The pen reshapes live while the shape is valid; otherwise it shows its old shape plus a red ghost.
    Object.assign(d.pen, d.valid ? d.rect : d.orig);
  } else if (d.kind === 'stock') {
    const panel = $('panel'), dx = px - d.sx, dy = py - d.sy;
    if (d.phase === 'press' && Math.hypot(dx, dy) > CONFIG.tapSlop) {
      // a mostly vertical slide scrolls the icon column (if it has anything to scroll)
      const canScroll = panel.scrollHeight > panel.clientHeight + 1;
      d.phase = canScroll && Math.abs(dy) > Math.abs(dx) ? 'scroll' : 'carry';
    }
    if (d.phase === 'scroll') {
      if (pointIn(panel, px, py)) panel.scrollTop -= (py - d.py);
      else d.phase = 'carry';          // left the column: now it is a drag
    }
    d.px = px; d.py = py;
  } else if (d.kind === 'animal') {
    d.px = px; d.py = py;
  }
}

/* ----- ending a gesture ----- */
function dropTarget(px, py) {
  const gy = py - Input.lift;   // the item is drawn above the finger; accept either point
  if (pointIn($('sell'), px, py) || pointIn($('sell'), px, gy)) return 'sell';
  if (pointIn($('panel'), px, py) || pointIn($('panel'), px, gy)) return 'stock';   // the animal list
  return null;
}

function dragEnd(px, py) {
  const d = UI.drag;
  if (!d) return;
  UI.drag = null;
  if (!G) return;

  if (d.kind === 'newpen') {
    if (!d.armed) { if (UI.mode === 'edit') UI.selectedPen = null; return; }   // just a tap on grass
    const r = rectFromCells(d.sx, d.sy, d.cx, d.cy);
    const info = checkNewPen(r);
    if (info.valid) { UI.pendingPen = r; openPenConfirm(r, info.cost); }
    // invalid rectangle: cancelled silently, pen mode stays on
  } else if (d.kind === 'corner') {
    const changed = d.valid && (d.rect.x !== d.orig.x || d.rect.y !== d.orig.y || d.rect.w !== d.orig.w || d.rect.h !== d.orig.h);
    if (changed) {
      Object.assign(d.pen, d.rect);
      G.money += d.refund - d.cost;
      Sound.play(d.cost > 0 ? 'buy' : d.refund > 0 ? 'sell' : 'drop');
      checkWin(); handleEvents();
    } else {
      Object.assign(d.pen, d.orig);   // snap back
    }
  } else if (d.kind === 'tap') {
    if (Math.hypot(px - d.sx, py - d.sy) <= CONFIG.tapSlop) {
      UI.selectedPen = (d.pen && d.pen !== UI.selectedPen) ? d.pen : null;
      if (UI.selectedPen) {
        Sound.play('tap');
        if (UI.selectedPen.animals.length) showToast(t('toast_pen_not_empty'));
      }
    }
  } else if (d.kind === 'animal') {
    d.animal.held = false;
    const target = dropTarget(px, py);
    if (target === 'stock') { returnToStock(d.pen, d.animal); Sound.play('drop'); refreshPanel(); }
    else if (target === 'sell') openSellConfirm(d.species, d.animal.adult, () => sellFromPen(d.pen, d.animal));
    else {
      // another pen that is empty or holds the same species: move there; anywhere else: back to its pen
      const f = toField(px, py - Input.lift), pen = penAtCell(f.cx, f.cy);
      if (pen && moveAnimal(d.pen, pen, d.animal, f.fx, f.fy)) Sound.play('drop');
    }
  } else if (d.kind === 'stock') {
    if (d.phase === 'press') { openPurchase(d.species); return; }   // a tap on the icon opens the shop
    if (d.phase !== 'carry' || !d.has) return;
    const target = dropTarget(px, py);
    if (target === 'sell') { openSellConfirm(d.species, d.adult, () => sellFromStock(d.species)); return; }
    if (target === 'stock') return;
    const f = toField(px, py - Input.lift);
    const pen = penAtCell(f.cx, f.cy);
    if (pen && placeFromStock(d.species, pen, f.fx, f.fy)) {
      Sound.play('drop'); refreshPanel(); checkWin(); handleEvents();
    }
    // grass or a pen of another species: the animal disappears, stock unchanged
  }
}

function cancelDrag() {
  const d = UI.drag;
  if (!d) return;
  UI.drag = null;
  if (d.kind === 'animal') d.animal.held = false;
  if (d.kind === 'corner') Object.assign(d.pen, d.orig);
}

/* =====================================================================
   7. RENDERING — canvas only, reads state, never changes it
   The world is drawn in an angled orthographic ("isometric") view:
   field x runs down-right on screen, field y runs down-left.
   ===================================================================== */
const View = {
  w: 0, h: 0, dpr: 1,
  field: { ox: 0, oy: 0, tw: 64, th: 36, cell: 36 },   // ox/oy: screen position of field corner (0,0);
                                                       // tw/th: tile diamond size; cell: tile edge length in px
  base: { tw: 64 },                    // tile width at zoom 1 (whole field fits)
  area: { x: 0, y: 0, w: 1, h: 1 },    // screen area between the floating UI
  zoom: 1,
  spriteCell: 0,
  grass: null, grassRim: 0,            // pre-rendered field
  trees: [],                           // decoration around the field
  sprites: new Map(),                  // key -> pre-rendered canvas (emoji icons, trees)
  frames: new Map()                    // species -> pre-rendered animation frames
};
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const ICON = { heart: '❤️', crowd: '😫', fear: '😱' };
const TAU = Math.PI * 2;

/** Field coordinates -> screen pixels. */
const sx = (fx, fy) => View.field.ox + (fx - fy) * View.field.tw / 2;
const sy = (fx, fy) => View.field.oy + (fx + fy) * View.field.th / 2;
function setTileSize(tw) {
  const F = View.field;
  F.tw = tw; F.th = tw * CONFIG.isoRatio; F.cell = Math.hypot(F.tw, F.th) / 2;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

function resize() {
  View.w = window.innerWidth; View.h = window.innerHeight;
  View.dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(View.w * View.dpr);
  canvas.height = Math.round(View.h * View.dpr);
  UI.rotate = View.h > View.w;
  $('rotate').classList.toggle('hidden', !UI.rotate);
  if (UI.rotate) cancelDrag();
  layoutField();
}

/** Fit the whole field between the floating UI and pre-render the ground. */
function layoutField() {
  if (!G) return;
  // free space between the animal list (left), the pen buttons (right) and the top bar
  const pr = $('panel').getBoundingClientRect(), er = $('btnEdit').getBoundingClientRect(), nr = $('btnPen').getBoundingClientRect();
  const left = (pr.width > 0 ? pr.right : 64) + 8;
  const right = (er.width > 0 ? View.w - Math.min(er.left, nr.left) : 110) + 8;
  const tc = $('topCenter').getBoundingClientRect();
  const headroom = 14;                               // room above the back corner for fences and animals
  const top = (tc.height > 0 ? tc.bottom : 52) + 6 + headroom;
  const bottom = (nr.height > 0 ? Math.max(8, View.h - nr.bottom) : 8) + 6;
  const availW = View.w - left - right, availH = View.h - top - bottom;
  const n = (G.cols + G.rows) / 2;                   // the field diamond is n tiles wide and n tiles tall
  const tw = Math.max(16, Math.floor(Math.min(availW / n, availH / (n * CONFIG.isoRatio))));
  View.base = { tw };
  View.area = { x: left, y: top, w: availW, h: availH };
  View.zoom = 1;
  setTileSize(tw);
  clampCamera();
  buildGround();
  buildTrees();
  View.sprites.clear(); View.frames.clear(); View.spriteCell = View.field.cell;
}

/** Zoom to `zoom` so that field point (fx, fy) sits at screen point (px, py). */
function setCamera(zoom, px, py, fx, fy) {
  View.zoom = clamp(zoom, 1, CONFIG.maxZoom);
  setTileSize(View.base.tw * View.zoom);
  const F = View.field;
  F.ox = px - (fx - fy) * F.tw / 2; F.oy = py - (fx + fy) * F.th / 2;
  clampCamera();
}
/** Keep the field centred while it fits, otherwise never scroll past its edges. */
function clampCamera() {
  if (!G) return;
  const F = View.field, A = View.area, n = (G.cols + G.rows) / 2, W = n * F.tw, H = n * F.th;
  let left = F.ox - G.rows * F.tw / 2, top = F.oy;
  left = W <= A.w ? A.x + (A.w - W) / 2 : clamp(left, A.x + A.w - W, A.x);
  top = H <= A.h ? A.y + (A.h - H) / 2 : clamp(top, A.y + A.h - H, A.y);
  F.ox = left + G.rows * F.tw / 2; F.oy = top;
}

/** Grass tiles with an earth rim, drawn once per layout at extra resolution. */
function buildGround() {
  const n = (G.cols + G.rows) / 2, tw = View.base.tw, th = tw * CONFIG.isoRatio;
  const W = n * tw, H = n * th, rim = Math.max(5, th * 0.28);
  const k = Math.min(View.dpr * 2, 2048 / W);
  const cv = makeCanvas(W * k, (H + rim) * k), g = cv.getContext('2d');
  g.scale(k, k);
  const X = (fx, fy) => G.rows * tw / 2 + (fx - fy) * tw / 2, Y = (fx, fy) => (fx + fy) * th / 2;
  const quad = (x0, y0, x1, y1) => {
    g.beginPath(); g.moveTo(X(x0, y0), Y(x0, y0)); g.lineTo(X(x1, y0), Y(x1, y0));
    g.lineTo(X(x1, y1), Y(x1, y1)); g.lineTo(X(x0, y1), Y(x0, y1)); g.closePath();
  };
  // earth rim below the two front edges gives the field some thickness
  const c = G.cols, r = G.rows;
  g.beginPath(); g.moveTo(X(0, r), Y(0, r)); g.lineTo(X(0, r), Y(0, r) + rim); g.lineTo(X(c, r), Y(c, r) + rim);
  g.lineTo(X(c, 0), Y(c, 0) + rim); g.lineTo(X(c, 0), Y(c, 0)); g.closePath();
  g.fillStyle = '#7a5a34'; g.fill();
  g.beginPath(); g.moveTo(X(c, r), Y(c, r)); g.lineTo(X(c, r), Y(c, r) + rim); g.lineTo(X(c, 0), Y(c, 0) + rim); g.lineTo(X(c, 0), Y(c, 0)); g.closePath();
  g.fillStyle = '#684b2a'; g.fill();
  // grass
  const tiles = Art.scenery('grass');
  quad(0, 0, c, r); g.fillStyle = '#6cc04b'; g.fill();
  if (tiles) {                                       // artist tiles: one image per cell
    for (let y = 0; y < r; y++) for (let x = 0; x < c; x++) {
      const im = tiles[(x * 7 + y * 13 + ((x * y) % 3)) % tiles.length];
      g.drawImage(im, X(x, y + 1) - 0.5, Y(x, y) - 0.5, tw + 1, th + 1);
    }
  }
  g.fillStyle = '#62b644';
  for (let y = 0; y < r && !tiles; y++) for (let x = (y + 1) % 2; x < c; x += 2) { quad(x, y, x + 1, y + 1); g.fill(); }
  g.strokeStyle = 'rgba(40,110,30,.6)'; g.lineWidth = Math.max(1, tw * 0.02); g.lineCap = 'round';
  for (let y = 0; y < r && !tiles; y++) for (let x = 0; x < c; x++) for (let i = 0; i < 2; i++) {   // grass tufts
    const fx = x + 0.2 + 0.6 * Math.random(), fy = y + 0.2 + 0.6 * Math.random(), bx = X(fx, fy), by = Y(fx, fy);
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx - tw * 0.025, by - tw * 0.07);
    g.moveTo(bx, by); g.lineTo(bx + tw * 0.03, by - tw * 0.06); g.stroke();
  }
  quad(0, 0, c, r); g.strokeStyle = '#4f9a36'; g.lineWidth = Math.max(1.5, tw * 0.03); g.stroke();
  View.grass = cv; View.grassRim = rim;
}

/** Scatter a few trees around the field (same layout every time for a given level). */
function buildTrees() {
  let seed = 12345 + G.levelIdx * 977;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const list = [];
  const add = (fx, fy) => list.push({ fx, fy, kind: rnd() < 0.5 ? 'tree' : 'pine', size: 0.85 + 0.4 * rnd(), pick: Math.floor(rnd() * 1000) });
  for (let i = 0; i < 9; i++) add(-1 - 4 * rnd(), -4 + (G.rows + 6) * rnd());      // behind the left edge
  for (let i = 0; i < 9; i++) add(-4 + (G.cols + 6) * rnd(), -1 - 4 * rnd());      // behind the right edge
  for (let i = 0; i < 4; i++) add(G.cols + 3.5 + 2 * rnd(), G.rows * rnd());       // far in front
  for (let i = 0; i < 4; i++) add(G.cols * rnd(), G.rows + 3.5 + 2 * rnd());
  list.sort((a, b) => (a.fx + a.fy) - (b.fx + b.fy));
  View.trees = list;
}

/* ----- generated placeholder art (the artist replaces animals via CONFIG.art) ----- */
const OUTLINE = '#3b2a1a';
const CRITTERS = {   // proportions of the placeholder animals, in a 1 × 1 box, facing right
  rabbit:   { body: '#efe7dc', dark: '#cfc4b4', bw: .23, bh: .17, leg: .10, legW: .075, head: .125, hx: .21, hy: -.13, ear: 'long',  tail: 'puff' },
  deer:     { body: '#bd7c40', dark: '#955f2e', bw: .25, bh: .135, leg: .33, legW: .05, head: .095, hx: .30, hy: -.25, ear: 'leaf',  tail: 'short', belly: '#efdcba', neck: true, antlers: true, snout: .06 },
  wolf:     { body: '#939aa3', dark: '#6d737c', bw: .27, bh: .14, leg: .23, legW: .06, head: .115, hx: .29, hy: -.10, ear: 'point', tail: 'bushy', snout: .10, snoutCol: '#c9ced4' },
  tiger:    { body: '#f59b2c', dark: '#cc7a17', bw: .29, bh: .15, leg: .19, legW: .075, head: .135, hx: .29, hy: -.09, ear: 'round', tail: 'long',  stripes: true, snout: .055, snoutCol: '#fff1dc' },
  elephant: { body: '#a2abb5', dark: '#7f8893', bw: .29, bh: .22, leg: .21, legW: .115, head: .17, hx: .25, hy: -.07, ear: 'big',   tail: 'thin',  trunk: true }
};

/** Draw one placeholder animal frame. g is scaled so the box is 1 × 1; feet stand at y = 0.95.
    eating = head down at the grass (phase 0 and 1 are its two frames). */
function drawCritter(g, sp, phase, walking, eating) {
  const ground = 0.95;
  const sw = walking ? Math.sin(phase) : 0;
  const bob = walking ? Math.abs(Math.cos(phase)) * 0.014 : (phase ? 0.008 : 0);
  const pen = () => { g.lineWidth = 0.017; g.strokeStyle = OUTLINE; };
  g.lineJoin = g.lineCap = 'round'; pen();
  const ell = (x, y, rx, ry, fill, rot) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); g.fillStyle = fill; g.fill(); g.stroke(); };
  const poly = (pts, fill) => { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fillStyle = fill; g.fill(); g.stroke(); };
  const curve = (p, w, col) => {    // thick outlined curve: start, control, end
    for (const [lw, c] of [[w + 0.034, OUTLINE], [w, col]]) {
      g.beginPath(); g.moveTo(p[0], p[1]); g.quadraticCurveTo(p[2], p[3], p[4], p[5]); g.lineWidth = lw; g.strokeStyle = c; g.stroke();
    }
    pen();
  };
  const dot = (x, y, r, col) => { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = col; g.fill(); };

  if (sp === 'chicken') {
    const bx = 0.45, by = 0.62 - bob, hipY = by + 0.13;
    for (const [x, a] of [[bx - 0.05, sw * 0.55], [bx + 0.05, -sw * 0.55]]) {       // legs
      g.save(); g.translate(x, hipY); g.rotate(a);
      g.strokeStyle = '#e08a1e'; g.lineWidth = 0.032;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, ground - hipY); g.lineTo(0.065, ground - hipY); g.stroke();
      g.restore();
    }
    pen();
    poly([bx - 0.12, by - 0.08, bx - 0.31, by - 0.22, bx - 0.27, by - 0.05, bx - 0.33, by + 0.02, bx - 0.15, by + 0.06], '#f3e9d8');   // tail feathers
    ell(bx, by, 0.2, 0.17, '#fffaf0');
    ell(bx - 0.03, by + 0.02, 0.11, 0.075, '#ece0cc', 0.3);                          // wing
    let hx = bx + 0.17, hy = by - 0.21;
    if (eating) {                                                                    // pecking at the ground
      hx = bx + 0.3; hy = ground - 0.15 - (phase ? 0.07 : 0);
      curve([bx + 0.12, by - 0.06, bx + 0.26, by - 0.08, hx - 0.02, hy - 0.02], 0.1, '#fffaf0');
    }
    for (const dx of [-0.045, 0.005, 0.055]) ell(hx + dx, hy - 0.09, 0.036, 0.046, '#e23b2e');   // comb
    ell(hx + 0.075, hy + 0.085, 0.026, 0.042, '#e23b2e');                            // wattle
    poly([hx + 0.07, hy - 0.035, hx + 0.2, hy + 0.01, hx + 0.07, hy + 0.05], '#f2a81d');          // beak
    ell(hx, hy, 0.1, 0.1, '#fffaf0');
    dot(hx + 0.04, hy - 0.02, 0.02, OUTLINE);
    return;
  }

  const s = CRITTERS[sp];
  const bx = 0.44, by = ground - s.leg - s.bh * 0.7 - bob, hip = by + s.bh * 0.35, L = ground - hip, A = 0.45 * sw;
  const leg = (x, ang, col) => {
    g.save(); g.translate(x, hip); g.rotate(ang);
    g.beginPath(); g.rect(-s.legW / 2, 0, s.legW, L); g.fillStyle = col; g.fill(); g.stroke();
    g.restore();
  };
  leg(bx + s.bw * 0.52, -A, s.dark); leg(bx - s.bw * 0.62, A, s.dark);               // far legs

  const tx = bx - s.bw * 0.92, ty = by - s.bh * 0.2;                                 // tail
  if (s.tail === 'puff') ell(tx - 0.02, ty + 0.02, 0.055, 0.055, '#ffffff');
  else if (s.tail === 'short') ell(tx - 0.015, ty - 0.03, 0.03, 0.055, s.belly, -0.6);
  else if (s.tail === 'bushy') ell(tx - 0.07, ty + 0.06, 0.13, 0.055, s.dark, -0.6);
  else if (s.tail === 'long') curve([tx + 0.02, ty, tx - 0.17, ty + 0.14, tx - 0.2, ty - 0.1], 0.04, s.body);
  else if (s.tail === 'thin') curve([tx + 0.01, ty, tx - 0.05, ty + 0.08, tx - 0.03, ty + 0.2], 0.018, s.dark);

  ell(bx, by, s.bw, s.bh, s.body);                                                   // body
  if (s.belly || s.stripes) {
    g.save(); g.beginPath(); g.ellipse(bx, by, s.bw - 0.008, s.bh - 0.008, 0, 0, TAU); g.clip();
    if (s.belly) { g.beginPath(); g.ellipse(bx, by + s.bh * 0.95, s.bw * 0.9, s.bh * 0.6, 0, 0, TAU); g.fillStyle = s.belly; g.fill(); }
    if (s.stripes) {
      g.strokeStyle = '#3b2a1a'; g.lineWidth = 0.03;
      for (const k of [-0.6, -0.25, 0.1, 0.45]) { g.beginPath(); g.moveTo(bx + k * s.bw, by - s.bh); g.lineTo(bx + k * s.bw - 0.035, by + s.bh * 0.15); g.stroke(); }
    }
    g.restore(); pen();
  }
  leg(bx + s.bw * 0.72, A, s.body); leg(bx - s.bw * 0.42, -A, s.body);               // near legs

  const r = s.head;                                                                  // head
  let hx = bx + s.hx, hy = by + s.hy;
  if (eating) {                                                                      // head down at the grass
    const chew = phase ? 0.022 : 0;
    if (s.trunk) hy += 0.05 + chew;                                                  // the elephant feeds with its trunk
    else {
      hx = Math.min(bx + s.bw * 0.85 + r * 0.55, 0.96 - r - (s.snout || 0));
      hy = ground - r - 0.035 - chew;
      if (!s.neck) curve([bx + s.bw * 0.55, by - s.bh * 0.15, hx - r * 0.2, by, hx - r * 0.2, hy - r * 0.1], r * 1.25, s.body);
    }
  }
  if (s.neck) curve([bx + s.bw * 0.62, by - s.bh * 0.25, hx - 0.03, by - s.bh * 0.6, hx - 0.01, hy + 0.02], 0.085, s.body);
  if (s.ear === 'long') { ell(hx - 0.04, hy - r - 0.06, 0.032, 0.105, s.body, -0.28); ell(hx + 0.02, hy - r - 0.07, 0.032, 0.105, s.body, -0.1); }
  else if (s.ear === 'leaf') ell(hx - r * 0.85, hy - r * 0.75, 0.055, 0.028, s.body, 0.5);
  else if (s.ear === 'point') { poly([hx - r * 0.9, hy - r * 0.35, hx - r * 0.55, hy - r * 1.6, hx - r * 0.05, hy - r * 0.85], s.dark); poly([hx - r * 0.3, hy - r * 0.7, hx + r * 0.15, hy - r * 1.6, hx + r * 0.5, hy - r * 0.75], s.body); }
  else if (s.ear === 'round') { ell(hx - r * 0.6, hy - r * 0.8, r * 0.36, r * 0.36, s.dark); ell(hx + r * 0.25, hy - r * 0.92, r * 0.34, r * 0.34, s.body); }
  if (s.trunk) curve([hx + r * 0.55, hy + r * 0.15, hx + r * 1.6, hy + r * 0.7, hx + r * (eating ? 0.75 : 1.1), ground - (eating ? 0.04 : 0.13 + bob)], 0.075, s.body);
  if (s.snout) { ell(hx + r * 0.78, hy + r * 0.28, s.snout, r * 0.52, s.snoutCol || s.body); dot(hx + r * 0.78 + s.snout * 0.8, hy + r * 0.1, 0.02, OUTLINE); }
  ell(hx, hy, r, r, s.body);
  if (sp === 'rabbit') dot(hx + r * 0.92, hy + 0.01, 0.018, '#e58aa0');
  dot(hx + r * 0.4, hy - r * 0.2, 0.02, OUTLINE);                                    // eye
  if (s.ear === 'big') ell(hx - r * 0.5, hy - r * 0.05, r * 0.62, r * 0.85, s.dark);
  if (s.trunk) { g.beginPath(); g.moveTo(hx + r * 0.7, hy + r * 0.55); g.lineTo(hx + r * 1.15, hy + r * 0.95); g.lineWidth = 0.03; g.strokeStyle = '#fffdf5'; g.stroke(); pen(); }
  if (s.antlers) {
    g.strokeStyle = '#7a5a35'; g.lineWidth = 0.024;
    g.beginPath(); g.moveTo(hx - 0.01, hy - r * 0.85); g.lineTo(hx - 0.05, hy - r - 0.15);
    g.moveTo(hx - 0.03, hy - r - 0.07); g.lineTo(hx + 0.04, hy - r - 0.12);
    g.moveTo(hx - 0.04, hy - r - 0.11); g.lineTo(hx - 0.11, hy - r - 0.13); g.stroke(); pen();
  }
}

function drawTree(g, kind) {   // 1 × 1 box, trunk base at y = 0.96
  g.lineJoin = 'round'; g.lineWidth = 0.018; g.strokeStyle = '#27441f';
  g.fillStyle = '#7a5230'; g.fillRect(0.45, 0.66, 0.1, 0.3); g.strokeRect(0.45, 0.66, 0.1, 0.3);
  if (kind === 'pine') {
    for (const [y, w, c] of [[0.78, 0.3, '#2f7d3a'], [0.58, 0.25, '#368a42'], [0.4, 0.19, '#3f9a4c']]) {
      g.beginPath(); g.moveTo(0.5 - w, y); g.lineTo(0.5, y - 0.3); g.lineTo(0.5 + w, y); g.closePath(); g.fillStyle = c; g.fill(); g.stroke();
    }
  } else {
    for (const [x, y, r, c] of [[0.33, 0.52, 0.19, '#3f9440'], [0.67, 0.52, 0.19, '#3f9440'], [0.5, 0.38, 0.27, '#55b14c']]) {
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = c; g.fill(); g.stroke();
    }
  }
}

/* ----- sprite caches ----- */
function sprite(key, draw) {
  let s = View.sprites.get(key);
  if (!s) {
    const size = Math.min(384, Math.ceil(Math.max(View.field.cell, 48) * View.dpr * 1.25));
    s = makeCanvas(size, size);
    draw(s.getContext('2d'), size);
    View.sprites.set(key, s);
  }
  return s;
}
function emojiSprite(emoji) {
  return sprite(emoji, (x, size) => {
    x.font = Math.floor(size * 0.7) + 'px ' + EMOJI_FONT;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(emoji, size / 2, size / 2 + size * 0.05);
  });
}
/** Draw an emoji sprite centred on (x, y) in a box of `size` CSS pixels. */
function drawEmoji(emoji, x, y, size) {
  ctx.drawImage(emojiSprite(emoji), x - size / 2, y - size / 2, size, size);
}

/** Animation frames of one species, pre-rendered as square canvases with the feet at the bottom centre. */
function animalFrames(sp) {
  let f = View.frames.get(sp);
  if (f) return f;
  const size = Math.min(320, Math.ceil(animalBox(sp) * View.dpr));
  const make = draw => { const c = makeCanvas(size, size); draw(c.getContext('2d')); return c; };
  const fromImage = im => make(g => {
    const k = Math.min(size / im.width, size / im.height), w = im.width * k, h = im.height * k;
    g.drawImage(im, (size - w) / 2, size - h, w, h);
  });
  const generated = (phase, walking, eating) => make(g => { g.scale(size, size); drawCritter(g, sp, phase, walking, eating); });
  const idleArt = Art.get(sp, 'idle'), walkArt = Art.get(sp, 'walk'), actionArt = Art.get(sp, 'action');
  const custom = !!(idleArt || walkArt || actionArt);
  f = {
    idle: idleArt ? idleArt.map(fromImage) : walkArt ? [fromImage(walkArt[0])] : [generated(0, false), generated(1, false)],
    walk: walkArt ? walkArt.map(fromImage) : idleArt ? null : [0, 1, 2, 3].map(i => generated(i * Math.PI / 2, true)),
    // action: artist frames if listed; otherwise herbivore placeholders eat grass and everything else has none
    action: actionArt ? actionArt.map(fromImage)
          : (!custom && CONFIG.animals[sp].diet === 'herbivore') ? [generated(0, false, true), generated(1, false, true)] : null,
    foot: custom ? 1 : 0.95,                                               // where the feet are inside the frame
    mirrorWhen: custom && CONFIG.art.facing === 'left' ? 1 : -1            // flip the frame when the animal faces this way
  };
  if (!f.walk) f.walk = f.idle;
  View.frames.set(sp, f);
  return f;
}
/** Size of an adult animal's frame on screen, in CSS pixels. */
function animalBox(sp) { return Math.max(View.field.cell * CONFIG.animalDrawSize, 30) * CONFIG.animals[sp].size; }
function animalScale(a) {
  if (a.adult) return 1;
  return CONFIG.babyScale + (1 - CONFIG.babyScale) * clamp(a.age / CONFIG.growTime, 0, 1);
}
/** Draw an animal standing on screen point (x, y). face: 1 = looking right, -1 = looking left.
    mode: 'idle' | 'walk' | 'action'; time: seconds into that animation. */
function drawAnimal(sp, x, y, box, face, mode, time) {
  const f = animalFrames(sp), A = CONFIG.art;
  if (mode === 'action' && !f.action) mode = 'idle';              // this animal has no action frames (yet)
  const frames = f[mode], fps = mode === 'walk' ? A.walkFps : mode === 'action' ? A.actionFps : A.idleFps;
  const img = frames[Math.floor(Math.max(0, time) * fps) % frames.length];
  const top = y - box * f.foot;
  if (face === f.mirrorWhen) {
    ctx.save(); ctx.translate(x, 0); ctx.scale(-1, 1);
    ctx.drawImage(img, -box / 2, top, box, box);
    ctx.restore();
  } else ctx.drawImage(img, x - box / 2, top, box, box);
}

/* ----- drawing helpers ----- */
function label(text, x, y, color) {
  ctx.font = '800 15px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color || '#fff'; ctx.fillText(text, x, y);
}
/** Trace a cell rectangle (a diamond on screen) as the current path. */
function rectPath(r) {
  const x0 = r.x, y0 = r.y, x1 = r.x + r.w, y1 = r.y + r.h;
  ctx.beginPath();
  ctx.moveTo(sx(x0, y0), sy(x0, y0)); ctx.lineTo(sx(x1, y0), sy(x1, y0));
  ctx.lineTo(sx(x1, y1), sy(x1, y1)); ctx.lineTo(sx(x0, y1), sy(x0, y1));
  ctx.closePath();
}
function rectCentre(r) { return { x: sx(r.x + r.w / 2, r.y + r.h / 2), y: sy(r.x + r.w / 2, r.y + r.h / 2) }; }

function drawPenGround(p, tint) {
  rectPath(p);
  ctx.fillStyle = 'rgba(228,204,140,.7)'; ctx.fill();             // trodden ground
  if (p.crowded || p.scared) { ctx.fillStyle = 'rgba(220,40,30,.18)'; ctx.fill(); }
  if (tint) { ctx.fillStyle = tint; ctx.fill(); }
}
/** One fence side from field point (x0, y0) to (x1, y1), with a post at each of the n cell boundaries. */
function drawFence(x0, y0, x1, y1, n) {
  const F = View.field, c = F.cell, ph = c * 0.46, pw = Math.max(3, c * 0.12);
  const ax = sx(x0, y0), ay = sy(x0, y0), bx = sx(x1, y1), by = sy(x1, y1);
  const seg = Art.scenery('fenceSegment'), post = Art.scenery('fencePost');
  if (seg) {                                        // artist fence: one image per tile edge
    const im = seg[0], w = F.tw / 2, h = im.height * w / im.width;
    for (let i = 0; i < n; i++) {
      const startX = ax + (bx - ax) * i / n, endY = ay + (by - ay) * (i + 1) / n;
      if (bx > ax) ctx.drawImage(im, startX, endY - h, w, h);                 // runs down-right
      else { ctx.save(); ctx.translate(startX, 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, endY - h, w, h); ctx.restore(); }   // down-left: mirrored
    }
  } else {
    ctx.lineCap = 'butt';
    for (const h of [0.36, 0.76]) {                               // two rails
      ctx.beginPath(); ctx.moveTo(ax, ay - ph * h); ctx.lineTo(bx, by - ph * h);
      ctx.lineWidth = Math.max(3, c * 0.11); ctx.strokeStyle = '#6b4520'; ctx.stroke();
      ctx.lineWidth = Math.max(1.5, c * 0.06); ctx.strokeStyle = '#c4915a'; ctx.stroke();
    }
  }
  if (!post && seg) return;                         // posts are part of the artist's segment
  for (let i = 0; i <= n; i++) {                                  // posts
    const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n;
    if (post) {
      const im = post[0], h = c * CONFIG.art.fencePostHeight, w = h * im.width / im.height;
      ctx.drawImage(im, x - w / 2, y - h, w, h);
      continue;
    }
    ctx.fillStyle = '#6b4520'; ctx.fillRect(x - pw / 2 - 1, y - ph - 1, pw + 2, ph + 2);
    ctx.fillStyle = '#a06c38'; ctx.fillRect(x - pw / 2, y - ph, pw, ph);
    ctx.fillStyle = '#d2a36a'; ctx.fillRect(x - pw / 2, y - ph, pw, Math.max(1.5, pw * 0.4));
  }
}
/** Back-to-front order for pens so nearer fences and animals cover farther ones. */
function penDrawOrder() {
  const pens = G.pens, n = pens.length, out = [], used = new Array(n).fill(false);
  const behind = (a, b) => (a.x + a.w <= b.x && !(b.y + b.h <= a.y)) || (a.y + a.h <= b.y && !(b.x + b.w <= a.x));
  for (let k = 0; k < n; k++) {
    let pick = -1;
    for (let i = 0; i < n && pick < 0; i++) {
      if (used[i]) continue;
      let free = true;
      for (let j = 0; j < n && free; j++) if (j !== i && !used[j] && behind(pens[j], pens[i])) free = false;
      if (free) pick = i;
    }
    if (pick < 0) pick = used.indexOf(false);
    used[pick] = true; out.push(pens[pick]);
  }
  return out;
}

function drawPreview(r, valid, cost) {
  rectPath(r);
  ctx.fillStyle = valid ? 'rgba(70,220,90,.42)' : 'rgba(235,50,40,.42)'; ctx.fill();
  ctx.strokeStyle = valid ? '#2ecc40' : '#ff3b2f'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  if (cost !== null) {
    const m = rectCentre(r);
    label(t('cost_label', { n: cost }), clamp(m.x, 30, View.w - 30), clamp(m.y, 14, View.h - 14), valid ? '#fff' : '#ffb3ad');
  }
}

const drawList = [];   // reused every frame for depth sorting

function render() {
  const F = View.field, c = F.cell, d = UI.drag;
  ctx.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
  ctx.fillStyle = '#4c8f3c';
  ctx.fillRect(0, 0, View.w, View.h);
  if (!View.grass) return;
  // Re-rasterize sprites once the zoom level has settled on a different size.
  if (!Input.pinch && Math.abs(c / (View.spriteCell || 1) - 1) > 0.25) { View.sprites.clear(); View.frames.clear(); View.spriteCell = c; }

  // Trees around the field
  const treeArt = Art.scenery('trees');
  for (const tr of View.trees) {
    const s = c * 2.3 * tr.size, x = sx(tr.fx, tr.fy), y = sy(tr.fx, tr.fy);
    if (x < -s || x > View.w + s || y < -s || y > View.h + s * 1.2) continue;
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.beginPath(); ctx.ellipse(x, y, s * 0.26, s * 0.09, 0, 0, TAU); ctx.fill();
    if (treeArt) {
      const im = treeArt[tr.pick % treeArt.length], h = c * CONFIG.art.treeHeight * tr.size, w = h * im.width / im.height;
      ctx.drawImage(im, x - w / 2, y - h, w, h);
    } else {
      ctx.drawImage(sprite(tr.kind, (g, size) => { g.scale(size, size); drawTree(g, tr.kind); }), x - s / 2, y - s * 0.96, s, s);
    }
  }

  // Field
  const n = (G.cols + G.rows) / 2, k = F.tw / View.base.tw;
  ctx.drawImage(View.grass, F.ox - G.rows * F.tw / 2, F.oy, n * F.tw, n * F.th + View.grassRim * k);

  // Pen floors (with green/red drop highlights while an animal is carried)
  const placing = !!d && (d.kind === 'animal' || (d.kind === 'stock' && d.has && d.phase === 'carry'));
  let hover = null;
  if (placing) { const f = toField(d.px, d.py - Input.lift); hover = penAtCell(f.cx, f.cy); }
  for (const p of G.pens) {
    let tint = null;
    if (placing && !(d.kind === 'animal' && p === d.pen)) {
      const ok = penAccepts(p, d.species), strong = p === hover ? '.5)' : '.25)';
      tint = (ok ? 'rgba(60,220,80,' : 'rgba(235,50,40,') + strong;
    }
    drawPenGround(p, tint);
  }

  // Pens back to front: far fences, animals, near fences
  for (const p of penDrawOrder()) {
    drawFence(p.x, p.y, p.x + p.w, p.y, p.w);
    drawFence(p.x, p.y, p.x, p.y + p.h, p.h);
